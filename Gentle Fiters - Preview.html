===================\n   Mobile\n========================= */\n\n@media (max-width: 700px) {\n\n    .sidebar {\n        width: 70px;\n        padding: 20px 8px;\n    }\n\n    .logo span,\n    .logo h2 {\n        display: none;\n    }\n\n    .sidebar-nav {\n        padding-right: 0;\n    }\n\n    .nav-link {\n        justify-content: center;\n        font-size: 0;\n    }\n\n    .nav-link span {\n        font-size: 18px;\n    }\n\n    .main-content {\n        margin-left: 70px;\n    }\n\n    .topbar {\n        padding: 0 15px;\n    }\n\n    .dashboard {\n        padding: 15px;\n    }\n\n    .stats-grid {\n        grid-template-columns: 1fr;\n    }\n}\u003c/style>\n    \u003cstyle>/* ================================\n   Reports Page\n================================ */\n\n.report-filters {\n    background: #fff;\n    padding: 20px;\n    border-radius: 12px;\n    display: flex;\n    align-items: flex-end;\n    gap: 18px;\n    margin-bottom: 25px;\n    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);\n}\n\n.filter-group {\n    display: flex;\n    flex-direction: column;\n    gap: 7px;\n    flex: 1;\n}\n\n.filter-group label {\n    font-size: 13px;\n    font-weight: 600;\n    color: #555;\n}\n\n.filter-group select,\n.filter-group input {\n    height: 42px;\n    padding: 0 12px;\n    border: 1px solid #ddd;\n    border-radius: 8px;\n    font-size: 14px;\n    outline: none;\n    background: #fff;\n}\n\n.filter-group select:focus,\n.filter-group input:focus {\n    border-color: #888;\n}\n\n.primary-btn {\n    height: 42px;\n    padding: 0 20px;\n    border: none;\n    border-radius: 8px;\n    cursor: pointer;\n    font-size: 14px;\n    font-weight: 600;\n}\n\n/* ================================\n   Report Stats\n================================ */\n\n.report-stats {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 18px;\n    margin-bottom: 30px;\n}\n\n.stat-card {\n    background: #fff;\n    border-radius: 12px;\n    padding: 20px;\n    display: flex;\n    align-items: center;\n    gap: 15px;\n    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);\n}\n\n.stat-icon {\n    width: 48px;\n    height: 48px;\n    border-radius: 10px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 23px;\n    background: #f3f3f3;\n}\n\n.stat-info {\n    display: flex;\n    flex-direction: column;\n    gap: 5px;\n}\n\n.stat-label {\n    font-size: 13px;\n    color: #777;\n}\n\n.stat-info strong {\n    font-size: 20px;\n}\n\n/* ================================\n   Report Sections\n================================ */\n\n.report-section {\n    background: #fff;\n    border-radius: 12px;\n    padding: 20px;\n    margin-bottom: 25px;\n    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);\n}\n\n.section-header {\n    margin-bottom: 18px;\n}\n\n.section-header h2 {\n    margin: 0 0 5px;\n    font-size: 19px;\n}\n\n.section-header p {\n    margin: 0;\n    color: #777;\n    font-size: 13px;\n}\n\n/* ================================\n   Report Tables\n================================ */\n\n.table-container {\n    overflow-x: auto;\n}\n\n.report-table {\n    width: 100%;\n    border-collapse: collapse;\n}\n\n.report-table th,\n.report-table td {\n    padding: 13px 12px;\n    text-align: left;\n    border-bottom: 1px solid #eee;\n    font-size: 14px;\n}\n\n.report-table th {\n    font-weight: 600;\n    color: #555;\n    background: #fafafa;\n}\n\n.report-table tbody tr:hover {\n    background: #fafafa;\n}\n\n.report-table td {\n    color: #444;\n}\n\n.report-table td:last-child {\n    font-weight: 600;\n}\n\n/* ================================\n   Responsive\n================================ */\n\n@media (max-width: 900px) {\n    .report-stats {\n        grid-template-columns: repeat(2, 1fr);\n    }\n\n    .report-filters {\n        flex-wrap: wrap;\n    }\n\n    .filter-group {\n        min-width: 200px;\n    }\n}\n\n@media (max-width: 600px) {\n    .report-stats {\n        grid-template-columns: 1fr;\n    }\n\n    .report-filters {\n        flex-direction: column;\n        align-items: stretch;\n    }\n\n    .filter-group {\n        width: 100%;\n    }\n\n    .primary-btn {\n        width: 100%;\n    }\n}\u003c/style>\n\u003c/head>\n\n\u003cbody>\n\n    \u003c!-- ==========================================\n         Sidebar\n    =========================================== -->\n\n    \u003caside class=\"sidebar\">\n\n        \u003cdiv class=\"logo\">\n            \u003ch2>Gentle Fiters\u003c/h2>\n            \u003cspan>Garments Management\u003c/span>\n        \u003c/div>\n\n\n        \u003cnav class=\"sidebar-nav\">\n            \u003ca href=\"index.html\" class=\"nav-link\">\n                \u003cspan>\ud83c\udfe0\u003c/span> Home\u003c/a>\n            \u003ca href=\"products.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\udc55\u003c/span> Products\u003c/a>\n            \u003ca href=\"categories.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\uddc2\ufe0f\u003c/span> Categories\u003c/a>\n            \u003ca href=\"sales.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\uded2\u003c/span> Sales / POS\u003c/a>\n            \u003ca href=\"sales-history.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\udccb\u003c/span> Sales History\u003c/a>\n            \u003ca href=\"customers.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\udc65\u003c/span> Customers\u003c/a>\n            \u003ca href=\"suppliers.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\ude9a\u003c/span> Suppliers\u003c/a>\n            \u003ca href=\"purchases.html\" class=\"nav-link\">\n                \u003cspan>\ud83e\uddfe\u003c/span> Purchases\u003c/a>\n            \u003ca href=\"expenses.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\udcb8\u003c/span> Expenses\u003c/a>\n            \u003ca href=\"returns.html\" class=\"nav-link\">\n                \u003cspan>\u21a9\ufe0f\u003c/span> Returns\u003c/a>\n            \u003ca href=\"reports.html\" class=\"nav-link active\">\n                \u003cspan>\ud83d\udcca\u003c/span> Reports\u003c/a>\n            \u003ca href=\"settings.html\" class=\"nav-link\">\n                \u003cspan>\u2699\ufe0f\u003c/span> Settings\u003c/a>\n        \u003c/nav>\n\n\n        \u003cdiv class=\"sidebar-bottom\">\n            \u003cp>Gentle Fiters v1.0\u003c/p>\n        \u003c/div>\n\n    \u003c/aside>\n\n\n    \u003c!-- ==========================================\n         Main Content\n    =========================================== -->\n\n    \u003cmain class=\"main-content\">\n\n        \u003cheader class=\"page-header\">\n\n            \u003cdiv>\n\n                \u003ch1>Reports\u003c/h1>\n\n                \u003cp>\n                    View your store performance and financial reports\n                \u003c/p>\n\n            \u003c/div>\n\n        \u003c/header>\n\n\n        \u003c!-- ==========================================\n             Report Filters\n        =========================================== -->\n\n        \u003csection class=\"report-filters\">\n\n            \u003cdiv class=\"filter-group\">\n\n                \u003clabel for=\"reportPeriod\">\n                    Report Period\n                \u003c/label>\n\n                \u003cselect id=\"reportPeriod\">\n\n                    \u003coption value=\"today\">\n                        Today\n                    \u003c/option>\n\n                    \u003coption value=\"week\">\n                        This Week\n                    \u003c/option>\n\n                    \u003coption value=\"month\" selected>\n                        This Month\n                    \u003c/option>\n\n                    \u003coption value=\"year\">\n                        This Year\n                    \u003c/option>\n\n                    \u003coption value=\"all\">\n                        All Time\n                    \u003c/option>\n\n                \u003c/select>\n\n            \u003c/div>\n\n\n            \u003cdiv class=\"filter-group\">\n\n                \u003clabel for=\"reportStartDate\">\n                    Start Date\n                \u003c/label>\n\n                \u003cinput type=\"date\" id=\"reportStartDate\">\n\n            \u003c/div>\n\n\n            \u003cdiv class=\"filter-group\">\n\n                \u003clabel for=\"reportEndDate\">\n                    End Date\n                \u003c/label>\n\n                \u003cinput type=\"date\" id=\"reportEndDate\">\n\n            \u003c/div>\n            \u003cbutton type=\"button\" class=\"primary-btn\" id=\"generateReport\" onclick=\"renderReport()\">\n                Generate Report\n            \u003c/button>\n\n        \u003c/section>\n\n\n        \u003c!-- ==========================================\n             Summary Cards\n        =========================================== -->\n\n        \u003csection class=\"report-stats\">\n\n            \u003cdiv class=\"stat-card\">\n\n                \u003cdiv class=\"stat-icon\">\n                    \ud83d\udcb0\n                \u003c/div>\n\n                \u003cdiv class=\"stat-info\">\n\n                    \u003cspan class=\"stat-label\">\n                        Total Sales\n                    \u003c/span>\n\n                    \u003cstrong id=\"reportSales\">\n                        Rs. 0.00\n                    \u003c/strong>\n\n                \u003c/div>\n\n            \u003c/div>\n\n\n            \u003cdiv class=\"stat-card\">\n\n                \u003cdiv class=\"stat-icon\">\n                    \ud83d\udce6\n                \u003c/div>\n\n                \u003cdiv class=\"stat-info\">\n\n                    \u003cspan class=\"stat-label\">\n                        Total Purchases\n                    \u003c/span>\n\n                    \u003cstrong id=\"reportPurchases\">\n                        Rs. 0.00\n                    \u003c/strong>\n\n                \u003c/div>\n\n            \u003c/div>\n\n\n            \u003cdiv class=\"stat-card\">\n\n                \u003cdiv class=\"stat-icon\">\n                    \ud83d\udcb8\n                \u003c/div>\n\n                \u003cdiv class=\"stat-info\">\n\n                    \u003cspan class=\"stat-label\">\n                        Total Expenses\n                    \u003c/span>\n\n                    \u003cstrong id=\"reportExpenses\">\n                        Rs. 0.00\n                    \u003c/strong>\n\n                \u003c/div>\n\n            \u003c/div>\n\n\n            \u003cdiv class=\"stat-card\">\n\n                \u003cdiv class=\"stat-icon\">\n                    \ud83d\udd04\n                \u003c/div>\n\n                \u003cdiv class=\"stat-info\">\n\n                    \u003cspan class=\"stat-label\">\n                        Return Amount\n                    \u003c/span>\n\n                    \u003cstrong id=\"reportReturns\">\n                        Rs. 0.00\n                    \u003c/strong>\n\n                \u003c/div>\n\n            \u003c/div>\n\n\n            \u003cdiv class=\"stat-card\">\n\n                \u003cdiv class=\"stat-icon\">\n                    \ud83d\udcc8\n                \u003c/div>\n\n                \u003cdiv class=\"stat-info\">\n\n                    \u003cspan class=\"stat-label\">\n                        Net Result\n                    \u003c/span>\n\n                    \u003cstrong id=\"reportNetResult\">\n                        Rs. 0.00\n                    \u003c/strong>\n\n                \u003c/div>\n\n            \u003c/div>\n\n\n            \u003cdiv class=\"stat-card\">\n\n                \u003cdiv class=\"stat-icon\">\n                    \ud83d\udecd\ufe0f\n                \u003c/div>\n\n                \u003cdiv class=\"stat-info\">\n\n                    \u003cspan class=\"stat-label\">\n                        Items Sold\n                    \u003c/span>\n\n                    \u003cstrong id=\"reportItemsSold\">\n                        0\n                    \u003c/strong>\n\n                \u003c/div>\n\n            \u003c/div>\n\n        \u003c/section>\n\n\n        \u003c!-- ==========================================\n             Sales Report\n        =========================================== -->\n\n        \u003csection class=\"report-section\">\n\n            \u003cdiv class=\"section-header\">\n\n                \u003cdiv>\n\n                    \u003ch2>Sales Report\u003c/h2>\n\n                    \u003cp>\n                        Sales performance for selected period\n                    \u003c/p>\n\n                \u003c/div>\n\n            \u003c/div>\n\n\n            \u003cdiv class=\"table-container\">\n\n                \u003ctable class=\"report-table\">\n\n                    \u003cthead>\n\n                        \u003ctr>\n\n                            \u003cth>Sale ID\u003c/th>\n                            \u003cth>Date\u003c/th>\n                            \u003cth>Customer\u003c/th>\n                            \u003cth>Items\u003c/th>\n                            \u003cth>Total\u003c/th>\n\n                        \u003c/tr>\n\n                    \u003c/thead>\n\n                    \u003ctbody id=\"salesReportBody\">\n\n                        \u003ctr>\n\n                            \u003ctd colspan=\"5\">\n                                No sales data\n                            \u003c/td>\n\n                        \u003c/tr>\n\n                    \u003c/tbody>\n\n                \u003c/table>\n\n            \u003c/div>\n\n        \u003c/section>\n\n\n        \u003c!-- ==========================================\n             Expenses Report\n        =========================================== -->\n\n        \u003csection class=\"report-section\">\n\n            \u003cdiv class=\"section-header\">\n\n                \u003cdiv>\n\n                    \u003ch2>Expenses Report\u003c/h2>\n\n                    \u003cp>\n                        Expense breakdown for selected period\n                    \u003c/p>\n\n                \u003c/div>\n\n            \u003c/div>\n\n\n            \u003cdiv class=\"table-container\">\n\n                \u003ctable class=\"report-table\">\n\n                    \u003cthead>\n\n                        \u003ctr>\n\n                            \u003cth>Date\u003c/th>\n                            \u003cth>Category\u003c/th>\n                            \u003cth>Description\u003c/th>\n                            \u003cth>Amount\u003c/th>\n\n                        \u003c/tr>\n\n                    \u003c/thead>\n\n                    \u003ctbody id=\"expensesReportBody\">\n\n                        \u003ctr>\n\n                            \u003ctd colspan=\"4\">\n                                No expense data\n                            \u003c/td>\n\n                        \u003c/tr>\n\n                    \u003c/tbody>\n\n                \u003c/table>\n\n            \u003c/div>\n\n        \u003c/section>\n\n\n        \u003c!-- ==========================================\n             Returns Report\n        =========================================== -->\n\n        \u003csection class=\"report-section\">\n\n            \u003cdiv class=\"section-header\">\n\n                \u003cdiv>\n\n                    \u003ch2>Returns Report\u003c/h2>\n\n                    \u003cp>\n                        Product returns for selected period\n                    \u003c/p>\n\n                \u003c/div>\n\n            \u003c/div>\n\n\n            \u003cdiv class=\"table-container\">\n\n                \u003ctable class=\"report-table\">\n\n                    \u003cthead>\n\n                        \u003ctr>\n\n                            \u003cth>Return ID\u003c/th>\n                            \u003cth>Date\u003c/th>\n                            \u003cth>Type\u003c/th>\n                            \u003cth>Product\u003c/th>\n                            \u003cth>Quantity\u003c/th>\n                            \u003cth>Amount\u003c/th>\n\n                        \u003c/tr>\n\n                    \u003c/thead>\n\n                    \u003ctbody id=\"returnsReportBody\">\n\n                        \u003ctr>\n\n                            \u003ctd colspan=\"6\">\n                                No return data\n                            \u003c/td>\n\n                        \u003c/tr>\n\n                    \u003c/tbody>\n\n                \u003c/table>\n\n            \u003c/div>\n\n        \u003c/section>\n\n    \u003c/main>\n\n\n    \u003c!-- Global Script -->\n    \u003cscript>\n/* =====================================\n   DASHBOARD - SAFE DATA HELPERS\n===================================== */\n\nfunction getDashboardData(key) {\n    try {\n        const data = JSON.parse(localStorage.getItem(key) || \"[]\");\n        return Array.isArray(data) ? data : [];\n    } catch (error) {\n        console.error(\"Dashboard data error:\", key, error);\n        return [];\n    }\n}\n\nfunction dashboardMoney(amount) {\n    const value = Number(amount) || 0;\n\n    return \"Rs. \" + value.toLocaleString(\"en-PK\", {\n        maximumFractionDigits: 2\n    });\n}\n\nfunction dashboardDate(dateValue) {\n    if (!dateValue) return null;\n\n    const date = new Date(dateValue);\n\n    return Number.isNaN(date.getTime()) ? null : date;\n}\n\nfunction dashboardSameDay(first, second) {\n    return first.getFullYear() === second.getFullYear() &&\n        first.getMonth() === second.getMonth() &&\n        first.getDate() === second.getDate();\n}\n\nfunction dashboardElement(id) {\n    return document.getElementById(id);\n}\n\n\n/* =====================================\n   DASHBOARD - MAIN STATISTICS\n===================================== */\n\nfunction loadDashboardStats() {\n    const sales = getDashboardData(\"gentleFitersSales\");\n    const products = getDashboardData(\"gentleFitersProducts\");\n\n    const today = new Date();\n\n    const todaysSales = sales.filter(function (sale) {\n        const date = dashboardDate(sale.date);\n        return date && dashboardSameDay(date, today);\n    });\n\n    const todayRevenue = todaysSales.reduce(function (total, sale) {\n        return total + (Number(sale.total) || 0);\n    }, 0);\n\n    const lowStockProducts = products.filter(function (product) {\n        return (Number(product.stock) || 0) \u003c= gfLowStockLimit();\n    });\n\n    const todaySalesElement = dashboardElement(\"todaySalesValue\");\n    const todayOrdersElement = dashboardElement(\"todayOrdersValue\");\n    const totalProductsElement = dashboardElement(\"totalProductsValue\");\n    const lowStockElement = dashboardElement(\"lowStockCount\");\n\n    if (todaySalesElement) {\n        todaySalesElement.textContent = dashboardMoney(todayRevenue);\n    }\n\n    if (todayOrdersElement) {\n        todayOrdersElement.textContent = todaysSales.length;\n    }\n\n    if (totalProductsElement) {\n        totalProductsElement.textContent = products.length;\n    }\n\n    if (lowStockElement) {\n        lowStockElement.textContent = lowStockProducts.length;\n    }\n}\n\n\n/* =====================================\n   DASHBOARD - LOW STOCK ALERTS\n===================================== */\n\nfunction loadDashboardLowStock() {\n    const container = dashboardElement(\"lowStockList\");\n\n    if (!container) return;\n\n    const products = getDashboardData(\"gentleFitersProducts\");\n\n    const lowStockProducts = products\n        .filter(function (product) {\n            return (Number(product.stock) || 0) \u003c= gfLowStockLimit();\n        })\n        .sort(function (a, b) {\n            return (Number(a.stock) || 0) -\n                (Number(b.stock) || 0);\n        })\n        .slice(0, 5);\n\n    container.replaceChildren();\n\n    if (lowStockProducts.length === 0) {\n        const message = document.createElement(\"p\");\n        message.textContent =\n            \"No low-stock products. Inventory looks good!\";\n        container.appendChild(message);\n        return;\n    }\n\n    lowStockProducts.forEach(function (product) {\n        const item = document.createElement(\"div\");\n        item.className = \"stock-item\";\n\n        const details = document.createElement(\"div\");\n\n        const name = document.createElement(\"strong\");\n        name.textContent = product.name || \"Unnamed Product\";\n\n        const description = document.createElement(\"span\");\n        const extraDetails = [product.size, product.color]\n            .filter(Boolean)\n            .join(\" / \");\n\n        description.textContent = extraDetails || \"Inventory alert\";\n\n        const stock = document.createElement(\"b\");\n        stock.textContent =\n            (Number(product.stock) || 0) + \" left\";\n\n        details.appendChild(name);\n        details.appendChild(description);\n\n        item.appendChild(details);\n        item.appendChild(stock);\n\n        container.appendChild(item);\n    });\n}\n\n\n/* =====================================\n   DASHBOARD - RECENT SALES\n===================================== */\n\nfunction loadDashboardRecentSales() {\n    const tbody = dashboardElement(\"recentSalesBody\");\n\n    if (!tbody) return;\n\n    const sales = getDashboardData(\"gentleFitersSales\");\n\n    const recentSales = sales.slice().sort(function (a, b) {\n        const dateA = dashboardDate(a.date);\n        const dateB = dashboardDate(b.date);\n\n        return (dateB ? dateB.getTime() : Number(b.id) || 0) -\n            (dateA ? dateA.getTime() : Number(a.id) || 0);\n    }).slice(0, 5);\n\n    tbody.replaceChildren();\n\n    if (recentSales.length === 0) {\n        const row = document.createElement(\"tr\");\n        const cell = document.createElement(\"td\");\n\n        cell.colSpan = 5;\n        cell.textContent = \"No sales recorded yet.\";\n\n        row.appendChild(cell);\n        tbody.appendChild(row);\n        return;\n    }\n\n    recentSales.forEach(function (sale) {\n        const row = document.createElement(\"tr\");\n\n        const saleId = document.createElement(\"td\");\n        saleId.textContent = sale.id ? String(sale.id) : \"\u2014\";\n\n        const dateCell = document.createElement(\"td\");\n        const date = dashboardDate(sale.date);\n\n        dateCell.textContent = date\n            ? date.toLocaleDateString()\n            : \"\u2014\";\n\n        const customerCell = document.createElement(\"td\");\n        customerCell.textContent =\n            sale.customerName || \"Walk-in Customer\";\n\n        const itemsCell = document.createElement(\"td\");\n        const itemCount = Array.isArray(sale.items)\n            ? sale.items.reduce(function (total, item) {\n                return total + (Number(item.quantity) || 0);\n            }, 0)\n            : 0;\n\n        itemsCell.textContent = itemCount;\n\n        const totalCell = document.createElement(\"td\");\n        totalCell.textContent = dashboardMoney(sale.total);\n\n        row.appendChild(saleId);\n        row.appendChild(dateCell);\n        row.appendChild(customerCell);\n        row.appendChild(itemsCell);\n        row.appendChild(totalCell);\n\n        tbody.appendChild(row);\n    });\n}\n\n\n/* =====================================\n   DASHBOARD - SALES CHART\n===================================== */\n\nfunction loadDashboardChart() {\n    const chart = dashboardElement(\"salesChart\");\n    const periodSelect = dashboardElement(\"salesPeriod\");\n\n    if (!chart) return;\n\n    const sales = getDashboardData(\"gentleFitersSales\");\n    const period = periodSelect ? periodSelect.value : \"7\";\n    const today = new Date();\n\n    let buckets = [];\n\n    if (period === \"year\") {\n        for (let month = 0; month \u003c 12; month++) {\n            buckets.push({\n                label: new Date(today.getFullYear(), month, 1)\n                    .toLocaleDateString(\"en\", { month: \"short\" }),\n                start: new Date(today.getFullYear(), month, 1),\n                end: new Date(today.getFullYear(), month + 1, 1),\n                total: 0\n            });\n        }\n    } else {\n        const days = period === \"30\" ? 30 : 7;\n\n        for (let i = days - 1; i >= 0; i--) {\n            const date = new Date(today);\n            date.setHours(0, 0, 0, 0);\n            date.setDate(date.getDate() - i);\n\n            const end = new Date(date);\n            end.setDate(end.getDate() + 1);\n\n            buckets.push({\n                label: period === \"30\"\n                    ? date.getDate() + \"/\" + (date.getMonth() + 1)\n                    : date.toLocaleDateString(\"en\", {\n                        weekday: \"short\"\n                    }),\n                start: date,\n                end: end,\n                total: 0\n            });\n        }\n    }\n\n    sales.forEach(function (sale) {\n        const date = dashboardDate(sale.date);\n\n        if (!date) return;\n\n        buckets.forEach(function (bucket) {\n            if (date >= bucket.start && date \u003c bucket.end) {\n                bucket.total += Number(sale.total) || 0;\n            }\n        });\n    });\n\n    chart.replaceChildren();\n\n    const maxTotal = Math.max(\n        ...buckets.map(function (bucket) {\n            return bucket.total;\n        }),\n        1\n    );\n\n    buckets.forEach(function (bucket) {\n        const column = document.createElement(\"div\");\n\n        column.style.display = \"flex\";\n        column.style.flexDirection = \"column\";\n        column.style.alignItems = \"center\";\n        column.style.justifyContent = \"flex-end\";\n        column.style.flex = \"1\";\n        column.style.minWidth = \"0\";\n        column.style.height = \"100%\";\n\n        const bar = document.createElement(\"div\");\n        bar.className = \"bar\";\n\n        bar.style.width =\n            period === \"30\" || period === \"year\" ? \"65%\" : \"35px\";\n\n        const height = bucket.total > 0\n            ? Math.max((bucket.total / maxTotal) * 85, 4)\n            : 2;\n\n        bar.style.height = height + \"%\";\n        bar.style.minHeight = \"2px\";\n        bar.title = bucket.label + \": \" +\n            dashboardMoney(bucket.total);\n\n        const label = document.createElement(\"span\");\n        label.textContent = bucket.label;\n\n        column.appendChild(bar);\n        column.appendChild(label);\n\n        chart.appendChild(column);\n    });\n}\n\n\n/* =====================================\n   INITIALIZE DASHBOARD\n===================================== */\n\nfunction loadDashboard() {\n    if (!dashboardElement(\"todaySalesValue\")) return;\n\n    loadDashboardStats();\n    loadDashboardLowStock();\n    loadDashboardRecentSales();\n    loadDashboardChart();\n}\n\nloadDashboard();\n\nconst dashboardPeriod = dashboardElement(\"salesPeriod\");\n\nif (dashboardPeriod) {\n    dashboardPeriod.addEventListener(\"change\", loadDashboardChart);\n}\n\n\n/* =====================================\n   GENTLE FITERS - SIDEBAR SCROLL\n===================================== */\n\n(function () {\n    const storageKey = \"gentleFitersSidebarScroll\";\n\n    function setupSidebarScroll() {\n        const sidebarNav = document.querySelector(\".sidebar-nav\");\n\n        if (!sidebarNav) return;\n\n        function saveSidebarScroll() {\n            try {\n                sessionStorage.setItem(\n                    storageKey,\n                    String(sidebarNav.scrollTop)\n                );\n            } catch (error) {\n                console.warn(\"Could not save sidebar position.\", error);\n            }\n        }\n\n        function restoreSidebarScroll() {\n            try {\n                const savedPosition = Number(\n                    sessionStorage.getItem(storageKey)\n                ) || 0;\n\n                const maxScroll = Math.max(\n                    0,\n                    sidebarNav.scrollHeight - sidebarNav.clientHeight\n                );\n\n                sidebarNav.scrollTop = Math.min(\n                    savedPosition,\n                    maxScroll\n                );\n            } catch (error) {\n                console.warn(\"Could not restore sidebar position.\", error);\n            }\n        }\n\n        // Save position when a sidebar link is clicked.\n        sidebarNav.addEventListener(\"click\", function (event) {\n            const link = event.target.closest(\"a.nav-link\");\n\n            if (link && sidebarNav.contains(link)) {\n                saveSidebarScroll();\n            }\n        }, true);\n\n        // Save the latest position before leaving the page.\n        window.addEventListener(\"pagehide\", saveSidebarScroll);\n\n        // Restore after page load and layout calculations.\n        function restoreSeveralTimes() {\n            restoreSidebarScroll();\n\n            requestAnimationFrame(function () {\n                restoreSidebarScroll();\n\n                requestAnimationFrame(function () {\n                    restoreSidebarScroll();\n                });\n            });\n\n            setTimeout(restoreSidebarScroll, 100);\n            setTimeout(restoreSidebarScroll, 300);\n            setTimeout(restoreSidebarScroll, 700);\n        }\n\n        if (document.readyState === \"complete\") {\n            restoreSeveralTimes();\n        } else {\n            window.addEventListener(\n                \"load\",\n                restoreSeveralTimes,\n                { once: true }\n            );\n        }\n    }\n\n    if (document.readyState === \"loading\") {\n        document.addEventListener(\n            \"DOMContentLoaded\",\n            setupSidebarScroll,\n            { once: true }\n        );\n    } else {\n        setupSidebarScroll();\n    }\n})();\n\n/* =====================================\n   GENTLE FITERS - SHARED HELPERS (all pages)\n===================================== */\n\n// Escape user text before putting it inside innerHTML.\nfunction gfEscape(value) {\n    return String(value === undefined || value === null ? \"\" : value)\n        .replace(/&/g, \"&amp;\")\n        .replace(/\u003c/g, \"&lt;\")\n        .replace(/>/g, \"&gt;\")\n        .replace(/\"/g, \"&quot;\")\n        .replace(/'/g, \"&#39;\");\n}\n\n// Low-stock limit comes from Settings > Inventory (default 5).\nfunction gfLowStockLimit() {\n    try {\n        const saved = JSON.parse(localStorage.getItem(\"gentleFitersSettings\") || \"{}\");\n        const limit = Number(saved && saved.inventory && saved.inventory.lowStockThreshold);\n        return Number.isFinite(limit) && limit >= 0 ? limit : 5;\n    } catch (error) {\n        return 5;\n    }\n}\n\nfunction gfRead(key) {\n    try {\n        const data = JSON.parse(localStorage.getItem(key) || \"[]\");\n        return Array.isArray(data) ? data : [];\n    } catch (error) {\n        return [];\n    }\n}\n\n// Default categories are created once, so the Categories page and the\n// Products page always share the same list.\n(function seedCategories() {\n    try {\n        if (localStorage.getItem(\"gentleFitersCategories\") !== null) return;\n\n        const names = [\"T-Shirts\", \"Shirts\", \"Jeans\", \"Trousers\", \"Jackets\"];\n        gfRead(\"gentleFitersProducts\").forEach(function (product) {\n            if (product.category && names.indexOf(product.category) === -1) {\n                names.push(product.category);\n            }\n        });\n\n        localStorage.setItem(\"gentleFitersCategories\", JSON.stringify(\n            names.map(function (name, index) {\n                return { id: Date.now() + index, name: name };\n            })\n        ));\n    } catch (error) {\n        console.warn(\"Could not seed categories.\", error);\n    }\n})();\n\n// Fill the category dropdowns on the Products page from saved categories.\nfunction gfFillCategorySelects() {\n    const names = gfRead(\"gentleFitersCategories\").map(function (c) { return c.name; });\n\n    gfRead(\"gentleFitersProducts\").forEach(function (product) {\n        if (product.category && names.indexOf(product.category) === -1) {\n            names.push(product.category);\n        }\n    });\n\n    [[\"productCategory\", \"Select Category\", \"\"], [\"categoryFilter\", \"All Categories\", \"all\"]]\n        .forEach(function (config) {\n            const select = document.getElementById(config[0]);\n            if (!select) return;\n\n            const previous = select.value;\n            select.replaceChildren();\n\n            const first = document.createElement(\"option\");\n            first.value = config[2];\n            first.textContent = config[1];\n            select.appendChild(first);\n\n            names.forEach(function (name) {\n                const option = document.createElement(\"option\");\n                option.value = name;\n                option.textContent = name;\n                select.appendChild(option);\n            });\n\n            select.value = previous;\n        });\n}\ngfFillCategorySelects();\n\n\n/* =====================================\n   GENTLE FITERS - NAVIGATION\n===================================== */\n\n(function setupNavigation() {\n    function init() {\n        // Make sure the right sidebar link is highlighted on every page.\n        const current = (location.pathname.split(\"/\").pop() || \"index.html\").toLowerCase();\n        document.querySelectorAll(\".sidebar-nav a.nav-link\").forEach(function (link) {\n            const target = (link.getAttribute(\"href\") || \"\").toLowerCase();\n            link.classList.toggle(\"active\", target === current);\n        });\n\n        // Browser tab title shows the current page name.\n        const heading = document.querySelector(\".topbar h1\");\n        if (heading && heading.textContent.trim()) {\n            document.title = heading.textContent.trim() + \" | Gentle Fiters\";\n        }\n\n        // Notification bell: shows low-stock count and opens Products.\n        const bell = document.querySelector(\".notification\");\n        if (bell) {\n            const low = gfRead(\"gentleFitersProducts\").filter(function (p) {\n                return (Number(p.stock) || 0) \u003c= gfLowStockLimit();\n            }).length;\n\n            bell.style.cursor = \"pointer\";\n            bell.style.position = \"relative\";\n            bell.setAttribute(\"role\", \"link\");\n            bell.title = low ? low + \" product(s) low on stock\" : \"No stock alerts\";\n\n            if (low > 0) {\n                const badge = document.createElement(\"span\");\n                badge.textContent = low > 99 ? \"99+\" : low;\n                badge.style.cssText = \"position:absolute;top:-6px;right:-8px;background:#ef4444;\" +\n                    \"color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;\" +\n                    \"border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;\";\n                bell.appendChild(badge);\n            }\n\n            bell.addEventListener(\"click\", function () {\n                window.location.href = \"products.html\";\n            });\n        }\n    }\n\n    if (document.readyState === \"loading\") {\n        document.addEventListener(\"DOMContentLoaded\", init, { once: true });\n    } else {\n        init();\n    }\n})();\n\u003c/script>\n\n    \u003c!-- Reports Script -->\n    \u003cscript>\n/* ==========================================\n   GENTLE FITERS - REPORTS.JS\n   Complete replacement\n========================================== */\n\nconst REPORT_STORAGE = {\n    sales: \"gentleFitersSales\",\n    purchases: \"gentleFitersPurchases\",\n    expenses: \"gentleFitersExpenses\",\n    returns: \"gentleFitersReturns\",\n    period: \"gentleFitersReportPeriod\",\n    start: \"gentleFitersReportStartDate\",\n    end: \"gentleFitersReportEndDate\"\n};\n\n/* ==========================================\n   HTML ELEMENTS\n========================================== */\n\nconst reportPeriod = document.getElementById(\"reportPeriod\");\nconst reportStartDate = document.getElementById(\"reportStartDate\");\nconst reportEndDate = document.getElementById(\"reportEndDate\");\nconst generateReport = document.getElementById(\"generateReport\");\n\nconst reportSales = document.getElementById(\"reportSales\");\nconst reportPurchases = document.getElementById(\"reportPurchases\");\nconst reportExpenses = document.getElementById(\"reportExpenses\");\nconst reportReturns = document.getElementById(\"reportReturns\");\nconst reportNetResult = document.getElementById(\"reportNetResult\");\nconst reportItemsSold = document.getElementById(\"reportItemsSold\");\n\nconst salesReportBody = document.getElementById(\"salesReportBody\");\nconst expensesReportBody = document.getElementById(\"expensesReportBody\");\nconst returnsReportBody = document.getElementById(\"returnsReportBody\");\n\n/* ==========================================\n   LOAD SAVED DATA\n========================================== */\n\nfunction readArray(key) {\n    try {\n        const value = JSON.parse(localStorage.getItem(key) || \"[]\");\n        return Array.isArray(value) ? value : [];\n    } catch (error) {\n        console.error(\"Unable to read localStorage key:\", key, error);\n        return [];\n    }\n}\n\nfunction loadData(primaryKey, aliases = []) {\n    const primaryData = readArray(primaryKey);\n\n    if (primaryData.length > 0) {\n        return primaryData;\n    }\n\n    for (const key of aliases) {\n        const data = readArray(key);\n\n        if (data.length > 0) {\n            console.warn(\"Report using alternate storage key:\", key);\n            return data;\n        }\n    }\n\n    return primaryData;\n}\n\nfunction getSales() {\n    return loadData(REPORT_STORAGE.sales);\n}\n\nfunction getPurchases() {\n    return loadData(REPORT_STORAGE.purchases);\n}\n\nfunction getExpenses() {\n    return loadData(REPORT_STORAGE.expenses, [\n        \"gentleFitersExpense\",\n        \"sbm_expenses\",\n        \"expenses\"\n    ]);\n}\n\nfunction getReturns() {\n    return loadData(REPORT_STORAGE.returns, [\n        \"gentleFitersReturn\",\n        \"sbm_returns\",\n        \"returns\"\n    ]);\n}\n\n/* ==========================================\n   DATE HELPERS\n========================================== */\n\nfunction parseDate(value) {\n    if (!value) return null;\n\n    if (typeof value === \"string\") {\n        const match = value.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);\n\n        if (match) {\n            const date = new Date(\n                Number(match[1]),\n                Number(match[2]) - 1,\n                Number(match[3]),\n                12, 0, 0, 0\n            );\n\n            if (\n                date.getFullYear() !== Number(match[1]) ||\n                date.getMonth() !== Number(match[2]) - 1 ||\n                date.getDate() !== Number(match[3])\n            ) {\n                return null;\n            }\n\n            return date;\n        }\n    }\n\n    const date = new Date(value);\n    return Number.isNaN(date.getTime()) ? null : date;\n}\n\nfunction startDay(date) {\n    return new Date(\n        date.getFullYear(),\n        date.getMonth(),\n        date.getDate(),\n        0, 0, 0, 0\n    );\n}\n\nfunction endDay(date) {\n    return new Date(\n        date.getFullYear(),\n        date.getMonth(),\n        date.getDate(),\n        23, 59, 59, 999\n    );\n}\n\nfunction getDateRange() {\n    const period = reportPeriod.value;\n\n    // Custom dates take priority when entered.\n    if (reportStartDate.value || reportEndDate.value) {\n        const start = reportStartDate.value\n            ? parseDate(reportStartDate.value)\n            : null;\n\n        const end = reportEndDate.value\n            ? parseDate(reportEndDate.value)\n            : null;\n\n        return {\n            start: start ? startDay(start) : null,\n            end: end ? endDay(end) : null\n        };\n    }\n\n    const now = new Date();\n\n    if (period === \"today\") {\n        return { start: startDay(now), end: endDay(now) };\n    }\n\n    if (period === \"week\") {\n        const start = new Date(\n            now.getFullYear(),\n            now.getMonth(),\n            now.getDate() - now.getDay()\n        );\n\n        return { start: startDay(start), end: endDay(now) };\n    }\n\n    if (period === \"month\") {\n        return {\n            start: new Date(now.getFullYear(), now.getMonth(), 1),\n            end: endDay(now)\n        };\n    }\n\n    if (period === \"year\") {\n        return {\n            start: new Date(now.getFullYear(), 0, 1),\n            end: endDay(now)\n        };\n    }\n\n    // HTML uses value=\"all\" for All Time.\n    if (period === \"all\") {\n        return { start: null, end: null };\n    }\n\n    return { start: null, end: null };\n}\n\nfunction recordDate(record) {\n    return record.date || record.createdAt || record.created_on || null;\n}\n\nfunction inRange(record, range) {\n    // All Time includes even records without a valid date.\n    if (!range.start && !range.end) return true;\n\n    const date = parseDate(recordDate(record));\n    if (!date) return false;\n\n    if (range.start && date \u003c range.start) return false;\n    if (range.end && date > range.end) return false;\n\n    return true;\n}\n\nfunction displayDate(value) {\n    const date = parseDate(value);\n    return date ? date.toLocaleDateString() : \"-\";\n}\n\nfunction amount(value) {\n    const number = Number(value);\n    return \"Rs. \" + (Number.isFinite(number) ? number : 0).toFixed(2);\n}\n\nfunction escapeHTML(value) {\n    const element = document.createElement(\"span\");\n    element.textContent = value == null ? \"\" : String(value);\n    return element.innerHTML;\n}\n\n/* ==========================================\n   TABLE HELPERS\n========================================== */\n\nfunction showEmptyRow(body, columns, message) {\n    body.innerHTML = \"\";\n\n    const row = document.createElement(\"tr\");\n    const cell = document.createElement(\"td\");\n\n    cell.colSpan = columns;\n    cell.textContent = message;\n\n    row.appendChild(cell);\n    body.appendChild(row);\n}\n\nfunction renderSales(items) {\n    if (!salesReportBody) return;\n\n    salesReportBody.innerHTML = \"\";\n\n    if (!items.length) {\n        showEmptyRow(salesReportBody, 5, \"No sales data for this period\");\n        return;\n    }\n\n    items.forEach(sale => {\n        const row = document.createElement(\"tr\");\n\n        const quantity = Array.isArray(sale.items)\n            ? sale.items.reduce(\n                (sum, item) => sum + (Number(item.quantity) || 0), 0\n            )\n            : 0;\n\n        const cells = [\n            \"#\" + (sale.id ?? \"-\"),\n            displayDate(recordDate(sale)),\n            sale.customerName || \"Walk-in Customer\",\n            quantity,\n            amount(sale.total ?? sale.grandTotal ?? sale.amount)\n        ];\n\n        cells.forEach(value => {\n            const cell = document.createElement(\"td\");\n            cell.textContent = String(value);\n            row.appendChild(cell);\n        });\n\n        salesReportBody.appendChild(row);\n    });\n}\n\nfunction renderExpenses(items) {\n    if (!expensesReportBody) return;\n\n    expensesReportBody.innerHTML = \"\";\n\n    if (!items.length) {\n        showEmptyRow(expensesReportBody, 4, \"No expense data for this period\");\n        return;\n    }\n\n    items.forEach(expense => {\n        const row = document.createElement(\"tr\");\n\n        [\n            displayDate(recordDate(expense)),\n            expense.category || \"-\",\n            expense.description || \"-\",\n            amount(expense.amount)\n        ].forEach(value => {\n            const cell = document.createElement(\"td\");\n            cell.textContent = String(value);\n            row.appendChild(cell);\n        });\n\n        expensesReportBody.appendChild(row);\n    });\n}\n\nfunction renderReturns(items) {\n    if (!returnsReportBody) return;\n\n    returnsReportBody.innerHTML = \"\";\n\n    if (!items.length) {\n        showEmptyRow(returnsReportBody, 6, \"No return data for this period\");\n        return;\n    }\n\n    items.forEach(item => {\n        const row = document.createElement(\"tr\");\n\n        [\n            \"#\" + (item.id ?? \"-\"),\n            displayDate(recordDate(item)),\n            item.type || \"-\",\n            item.productName || \"-\",\n            item.quantity ?? 0,\n            amount(item.amount)\n        ].forEach(value => {\n            const cell = document.createElement(\"td\");\n            cell.textContent = String(value);\n            row.appendChild(cell);\n        });\n\n        returnsReportBody.appendChild(row);\n    });\n}\n\n/* ==========================================\n   GENERATE REPORT\n========================================== */\n\nfunction renderReport() {\n    try {\n        // Reload data every time the button is clicked.\n        const sales = getSales();\n        const purchases = getPurchases();\n        const expenses = getExpenses();\n        const returns = getReturns();\n\n        const range = getDateRange();\n\n        const filteredSales = sales.filter(item => inRange(item, range));\n        const filteredPurchases = purchases.filter(item => inRange(item, range));\n        const filteredExpenses = expenses.filter(item => inRange(item, range));\n        const filteredReturns = returns.filter(item => inRange(item, range));\n\n        const salesTotal = filteredSales.reduce(\n            (sum, item) => sum + (\n                Number(item.total ?? item.grandTotal ?? item.amount) || 0\n            ),\n            0\n        );\n\n        const purchasesTotal = filteredPurchases.reduce(\n            (sum, item) => sum + (\n                Number(item.total ?? item.grandTotal ?? item.amount) || 0\n            ),\n            0\n        );\n\n        const expensesTotal = filteredExpenses.reduce(\n            (sum, item) => sum + (Number(item.amount) || 0),\n            0\n        );\n\n        const returnsTotal = filteredReturns.reduce(\n            (sum, item) => sum + (Number(item.amount) || 0),\n            0\n        );\n\n        const itemsSold = filteredSales.reduce((sum, sale) => {\n            if (!Array.isArray(sale.items)) return sum;\n\n            return sum + sale.items.reduce(\n                (itemSum, item) => itemSum + (Number(item.quantity) || 0),\n                0\n            );\n        }, 0);\n\n        const netResult =\n            salesTotal - purchasesTotal - expensesTotal - returnsTotal;\n\n        if (reportSales) reportSales.textContent = amount(salesTotal);\n        if (reportPurchases) reportPurchases.textContent = amount(purchasesTotal);\n        if (reportExpenses) reportExpenses.textContent = amount(expensesTotal);\n        if (reportReturns) reportReturns.textContent = amount(returnsTotal);\n        if (reportNetResult) reportNetResult.textContent = amount(netResult);\n        if (reportItemsSold) reportItemsSold.textContent = String(itemsSold);\n\n        renderSales(filteredSales);\n        renderExpenses(filteredExpenses);\n        renderReturns(filteredReturns);\n\n        console.log(\"Report updated\", {\n            sales: filteredSales.length,\n            purchases: filteredPurchases.length,\n            expenses: filteredExpenses.length,\n            returns: filteredReturns.length,\n            period: reportPeriod.value\n        });\n    } catch (error) {\n        console.error(\"Could not generate report:\", error);\n        alert(\"Report generate nahi hui. Browser Console mein error check karein.\");\n    }\n}\n\n/* ==========================================\n   FILTER EVENTS AND SAVED SETTINGS\n========================================== */\n\nif (reportPeriod) {\n    const savedPeriod = localStorage.getItem(REPORT_STORAGE.period);\n\n    reportPeriod.value = savedPeriod || reportPeriod.value || \"month\";\n\n    reportPeriod.addEventListener(\"change\", () => {\n        localStorage.setItem(REPORT_STORAGE.period, reportPeriod.value);\n\n        reportStartDate.value = \"\";\n        reportEndDate.value = \"\";\n\n        localStorage.removeItem(REPORT_STORAGE.start);\n        localStorage.removeItem(REPORT_STORAGE.end);\n\n        renderReport();\n    });\n}\n\nif (reportStartDate) {\n    reportStartDate.value = localStorage.getItem(REPORT_STORAGE.start) || \"\";\n\n    reportStartDate.addEventListener(\"change\", () => {\n        if (reportStartDate.value) {\n            localStorage.setItem(REPORT_STORAGE.start, reportStartDate.value);\n        } else {\n            localStorage.removeItem(REPORT_STORAGE.start);\n        }\n    });\n}\n\nif (reportEndDate) {\n    reportEndDate.value = localStorage.getItem(REPORT_STORAGE.end) || \"\";\n\n    reportEndDate.addEventListener(\"change\", () => {\n        if (reportEndDate.value) {\n            localStorage.setItem(REPORT_STORAGE.end, reportEndDate.value);\n        } else {\n            localStorage.removeItem(REPORT_STORAGE.end);\n        }\n    });\n}\n\nif (generateReport) {\n    generateReport.addEventListener(\"click\", event => {\n        event.preventDefault();\n        localStorage.setItem(REPORT_STORAGE.period, reportPeriod.value);\n        renderReport();\n    });\n} else {\n    console.error('Reports: button #generateReport not found.');\n}\n\n// Initial display.\nrenderReport();\u003c/script>\n\n\u003cscript>document.addEventListener(\"click\",function(e){var a=e.target.closest(\"a[href$=\\\".html\\\"]\");if(a){e.preventDefault();parent.postMessage({gfPage:a.getAttribute(\"href\")},\"*\");}});\u003c/script>\u003c/body>\n\n\u003c/html>", "suppliers.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\n\u003chead>\n    \u003cmeta charset=\"UTF-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\n    \u003ctitle>Suppliers - Gentle Fiters\u003c/title>\n\n    \u003cstyle>* {\n    margin: 0;\n    padding: 0;\n    box-sizing: border-box;\n}\nya lo complete css \nbody {\n    font-family: Arial, sans-serif;\n    background: #f5f7fb;\n    color: #1f2937;\n}\n\n\n/* =========================\n   Sidebar\n========================= */\n\n.sidebar {\n    width: 250px;\n    height: 100vh;\n    background: #111827;\n    color: white;\n\n    position: fixed;\n    left: 0;\n    top: 0;\n\n    padding: 25px 15px;\n\n    display: flex;\n    flex-direction: column;\n\n    /* Sidebar itself will NOT scroll */\n    overflow: hidden;\n}\n\n\n/* =========================\n   Logo\n========================= */\n\n.logo {\n    padding: 0 12px 30px;\n    border-bottom: 1px solid #374151;\n    flex-shrink: 0;\n}\n\n.logo h2 {\n    font-size: 28px;\n}\n\n.logo span {\n    font-size: 12px;\n    color: #9ca3af;\n}\n\n\n/* =========================\n   Navigation\n========================= */\n\n.sidebar-nav {\n    margin-top: 25px;\n\n    /* Take all remaining sidebar height */\n    flex: 1 1 auto;\n\n    /* VERY IMPORTANT for flex scrolling */\n    min-height: 0;\n\n    /* Only navigation scrolls */\n    overflow-y: auto;\n    overflow-x: hidden;\n\n    padding-right: 5px;\n}\n\n\n/* =========================\n   Navigation Scrollbar\n========================= */\n\n.sidebar-nav::-webkit-scrollbar {\n    width: 6px;\n}\n\n.sidebar-nav::-webkit-scrollbar-track {\n    background: transparent;\n}\n\n.sidebar-nav::-webkit-scrollbar-thumb {\n    background: #374151;\n    border-radius: 10px;\n}\n\n.sidebar-nav::-webkit-scrollbar-thumb:hover {\n    background: #4b5563;\n}\n\n\n/* =========================\n   Navigation Links\n========================= */\n\n.nav-link {\n    display: flex;\n    align-items: center;\n    gap: 12px;\n\n    color: #d1d5db;\n    text-decoration: none;\n\n    padding: 12px;\n\n    border-radius: 8px;\n    margin-bottom: 6px;\n\n    font-size: 14px;\n}\n\n.nav-link:hover,\n.nav-link.active {\n    background: #2563eb;\n    color: white;\n}\n\n.nav-link span {\n    width: 22px;\n    flex-shrink: 0;\n}\n\n\n/* =========================\n   Sidebar Bottom\n========================= */\n\n.sidebar-bottom {\n    margin-top: 15px;\n\n    padding: 15px 10px 5px;\n\n    color: #6b7280;\n    font-size: 12px;\n\n    border-top: 1px solid #374151;\n\n    /* Footer stays at bottom */\n    flex-shrink: 0;\n}\n\n\n/* =========================\n   Main\n========================= */\n\n.main-content {\n    margin-left: 250px;\n    min-height: 100vh;\n}\n\n\n/* =========================\n   Topbar\n========================= */\n\n.topbar {\n    height: 85px;\n    background: white;\n    border-bottom: 1px solid #e5e7eb;\n\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n\n    padding: 0 30px;\n}\n\n.topbar h1 {\n    font-size: 24px;\n    margin-bottom: 4px;\n}\n\n.topbar p {\n    font-size: 13px;\n    color: #6b7280;\n}\n\n.user-area {\n    display: flex;\n    align-items: center;\n    gap: 15px;\n}\n\n.notification {\n    font-size: 20px;\n}\n\n.user-info {\n    display: flex;\n    flex-direction: column;\n    gap: 3px;\n}\n\n.user-info strong {\n    font-size: 14px;\n}\n\n.user-info span {\n    font-size: 12px;\n    color: #6b7280;\n}\n\n\n/* =========================\n   Dashboard\n========================= */\n\n.dashboard {\n    padding: 30px;\n}\n\n\n/* =========================\n   Stats\n========================= */\n\n.stats-grid {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 20px;\n}\n\n.stat-card {\n    background: white;\n    border: 1px solid #e5e7eb;\n    border-radius: 12px;\n\n    padding: 22px;\n\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n}\n\n.stat-card p {\n    color: #6b7280;\n    font-size: 13px;\n    margin-bottom: 8px;\n}\n\n.stat-card h2 {\n    font-size: 22px;\n    margin-bottom: 8px;\n}\n\n.stat-card span {\n    font-size: 12px;\n    color: #6b7280;\n}\n\n.stat-card .positive {\n    color: #16a34a;\n}\n\n.stat-icon {\n    font-size: 25px;\n    background: #eff6ff;\n    padding: 12px;\n    border-radius: 10px;\n}\n\n\n/* =========================\n   Cards\n========================= */\n\n.card {\n    background: white;\n    border: 1px solid #e5e7eb;\n    border-radius: 12px;\n    padding: 22px;\n}\n\n.dashboard-grid {\n    display: grid;\n    grid-template-columns: 2fr 1fr;\n    gap: 20px;\n    margin-top: 20px;\n}\n\n.card-header {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    margin-bottom: 25px;\n}\n\n.card-header h3 {\n    font-size: 17px;\n    margin-bottom: 5px;\n}\n\n.card-header p {\n    font-size: 12px;\n    color: #6b7280;\n}\n\n.card-header select {\n    border: 1px solid #d1d5db;\n    padding: 8px 10px;\n    border-radius: 6px;\n}\n\n\n/* =========================\n   Chart\n========================= */\n\n.chart {\n    height: 250px;\n\n    display: flex;\n    align-items: flex-end;\n    justify-content: space-around;\n\n    gap: 15px;\n\n    border-bottom: 1px solid #e5e7eb;\n\n    padding: 20px 10px 0;\n}\n\n.bar {\n    width: 35px;\n\n    background: #2563eb;\n\n    border-radius: 6px 6px 0 0;\n\n    position: relative;\n\n    min-height: 20px;\n}\n\n.bar span {\n    position: absolute;\n\n    top: 105%;\n    left: 50%;\n\n    transform: translateX(-50%);\n\n    font-size: 11px;\n\n    color: #6b7280;\n}\n\n\n/* =========================\n   Stock\n========================= */\n\n.stock-list {\n    display: flex;\n    flex-direction: column;\n    gap: 15px;\n}\n\n.stock-item {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n\n    padding-bottom: 14px;\n\n    border-bottom: 1px solid #f0f0f0;\n}\n\n.stock-item div {\n    display: flex;\n    flex-direction: column;\n    gap: 5px;\n}\n\n.stock-item strong {\n    font-size: 13px;\n}\n\n.stock-item span {\n    font-size: 11px;\n    color: #6b7280;\n}\n\n.stock-item b {\n    font-size: 12px;\n    color: #dc2626;\n}\n\n.view-btn {\n    border: none;\n\n    background: #eff6ff;\n    color: #2563eb;\n\n    padding: 8px 12px;\n\n    border-radius: 6px;\n\n    cursor: pointer;\n}\n\n\n/* =========================\n   Recent Orders\n========================= */\n\n.recent-orders {\n    margin-top: 20px;\n}\n\n.table-wrapper {\n    overflow-x: auto;\n}\n\ntable {\n    width: 100%;\n    border-collapse: collapse;\n}\n\nth,\ntd {\n    padding: 14px 10px;\n\n    text-align: left;\n\n    border-bottom: 1px solid #f0f0f0;\n\n    font-size: 13px;\n}\n\nth {\n    color: #6b7280;\n\n    font-size: 12px;\n\n    font-weight: 600;\n}\n\n.status {\n    padding: 5px 9px;\n\n    border-radius: 20px;\n\n    font-size: 11px;\n}\n\n.completed {\n    background: #dcfce7;\n    color: #15803d;\n}\n\n.pending {\n    background: #fef3c7;\n    color: #b45309;\n}\n\n\n/* =========================\n   Responsive\n========================= */\n\n@media (max-width: 1100px) {\n\n    .stats-grid {\n        grid-template-columns: repeat(2, 1fr);\n    }\n\n    .dashboard-grid {\n        grid-template-columns: 1fr;\n    }\n}\n\n\n/* =========================\n   Mobile\n========================= */\n\n@media (max-width: 700px) {\n\n    .sidebar {\n        width: 70px;\n        padding: 20px 8px;\n    }\n\n    .logo span,\n    .logo h2 {\n        display: none;\n    }\n\n    .sidebar-nav {\n        padding-right: 0;\n    }\n\n    .nav-link {\n        justify-content: center;\n        font-size: 0;\n    }\n\n    .nav-link span {\n        font-size: 18px;\n    }\n\n    .main-content {\n        margin-left: 70px;\n    }\n\n    .topbar {\n        padding: 0 15px;\n    }\n\n    .dashboard {\n        padding: 15px;\n    }\n\n    .stats-grid {\n        grid-template-columns: 1fr;\n    }\n}\u003c/style>\n    \u003cstyle>/* =========================================\n   SUPPLIERS PAGE\n   ========================================= */\n\n/* Page Header */\n\n.page-header {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    margin-bottom: 25px;\n}\n\n.page-header h2 {\n    margin: 0 0 5px;\n}\n\n.page-header p {\n    margin: 0;\n    color: #777;\n}\n\n\n/* =========================================\n   STATS\n   ========================================= */\n\n.stats-grid {\n    display: grid;\n    grid-template-columns: repeat(2, 1fr);\n    gap: 20px;\n    margin-bottom: 25px;\n}\n\n.stat-card {\n    background: #ffffff;\n    padding: 22px;\n    border-radius: 10px;\n    border: 1px solid #e5e7eb;\n    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);\n}\n\n.stat-card h3 {\n    margin: 0 0 10px;\n    font-size: 15px;\n    color: #666;\n    font-weight: 500;\n}\n\n.stat-card p {\n    margin: 0;\n    font-size: 28px;\n    font-weight: 700;\n    color: #222;\n}\n\n\n/* =========================================\n   SUPPLIER TABLE\n   ========================================= */\n\n.table-card {\n    background: #ffffff;\n    border-radius: 10px;\n    border: 1px solid #e5e7eb;\n    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);\n    overflow: hidden;\n}\n\n.table-header {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    padding: 20px;\n    border-bottom: 1px solid #e5e7eb;\n}\n\n.table-header h2 {\n    margin: 0;\n    font-size: 20px;\n}\n\n#supplierSearch {\n    width: 260px;\n    padding: 10px 12px;\n    border: 1px solid #ccc;\n    border-radius: 6px;\n    outline: none;\n    font-size: 14px;\n}\n\n#supplierSearch:focus {\n    border-color: #007bff;\n}\n\n\n/* Table */\n\n.table-card table {\n    width: 100%;\n    border-collapse: collapse;\n}\n\n.table-card th {\n    background: #f8f9fa;\n    color: #555;\n    font-size: 14px;\n    font-weight: 600;\n    padding: 14px 12px;\n    text-align: left;\n    border-bottom: 1px solid #ddd;\n}\n\n.table-card td {\n    padding: 14px 12px;\n    border-bottom: 1px solid #eee;\n    font-size: 14px;\n    color: #333;\n}\n\n.table-card tbody tr:hover {\n    background: #f8f9fa;\n}\n\n\n/* Empty Table Message */\n\n#supplierTableBody:empty::after {\n    content: \"No suppliers found\";\n    display: table-cell;\n    text-align: center;\n    padding: 30px;\n    color: #888;\n}\n\n\n/* =========================================\n   SUPPLIER MODAL\n   ========================================= */\n\n#supplierModal {\n    display: none;\n    position: fixed;\n    z-index: 1000;\n    inset: 0;\n    background: rgba(0, 0, 0, 0.5);\n\n    align-items: center;\n    justify-content: center;\n\n    padding: 20px;\n}\n\n\n/* Modal Content */\n\n#supplierModal .modal-content {\n    width: 100%;\n    max-width: 550px;\n    background: #ffffff;\n    border-radius: 10px;\n    padding: 25px;\n    box-sizing: border-box;\n    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);\n\n    max-height: 90vh;\n    overflow-y: auto;\n}\n\n\n/* Modal Header */\n\n#supplierModal .modal-header {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n\n    margin-bottom: 20px;\n    padding-bottom: 15px;\n\n    border-bottom: 1px solid #e5e7eb;\n}\n\n#supplierModal .modal-header h2 {\n    margin: 0;\n    font-size: 22px;\n}\n\n#closeSupplierModal {\n    border: none;\n    background: transparent;\n    font-size: 28px;\n    cursor: pointer;\n    color: #666;\n    line-height: 1;\n}\n\n#closeSupplierModal:hover {\n    color: #000;\n}\n\n\n/* =========================================\n   FORM\n   ========================================= */\n\n#supplierForm .form-group {\n    margin-bottom: 17px;\n}\n\n#supplierForm label {\n    display: block;\n    margin-bottom: 7px;\n    font-size: 14px;\n    font-weight: 600;\n    color: #333;\n}\n\n#supplierForm input {\n    width: 100%;\n    box-sizing: border-box;\n\n    padding: 11px 12px;\n\n    border: 1px solid #ccc;\n    border-radius: 6px;\n\n    font-size: 14px;\n    outline: none;\n}\n\n#supplierForm input:focus {\n    border-color: #007bff;\n    box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.08);\n}\n\n\n/* =========================================\n   MODAL BUTTONS\n   ========================================= */\n\n#supplierModal .modal-actions {\n    display: flex;\n    justify-content: flex-end;\n    gap: 10px;\n\n    margin-top: 25px;\n    padding-top: 18px;\n\n    border-top: 1px solid #e5e7eb;\n}\n\n#supplierModal .primary-btn,\n#supplierModal .cancel-btn {\n    padding: 10px 18px;\n    border-radius: 6px;\n    cursor: pointer;\n    font-size: 14px;\n    border: none;\n}\n\n#supplierModal .primary-btn {\n    background: #007bff;\n    color: #ffffff;\n}\n\n#supplierModal .primary-btn:hover {\n    background: #0056b3;\n}\n\n#supplierModal .cancel-btn {\n    background: #e9ecef;\n    color: #333;\n}\n\n#supplierModal .cancel-btn:hover {\n    background: #dfe3e6;\n}\n\n\n/* =========================================\n   RESPONSIVE DESIGN\n   ========================================= */\n\n@media (max-width: 1000px) {\n\n    .table-card {\n        overflow-x: auto;\n    }\n\n    .table-card table {\n        min-width: 850px;\n    }\n}\n\n\n@media (max-width: 700px) {\n\n    .page-header {\n        flex-direction: column;\n        align-items: flex-start;\n        gap: 15px;\n    }\n\n    .stats-grid {\n        grid-template-columns: 1fr;\n    }\n\n    .table-header {\n        flex-direction: column;\n        align-items: flex-start;\n        gap: 15px;\n    }\n\n    #supplierSearch {\n        width: 100%;\n        box-sizing: border-box;\n    }\n\n    #supplierModal .modal-content {\n        padding: 20px;\n    }\n}\u003c/style>\n\u003c/head>\n\n\u003cbody>\n\n\u003cdiv class=\"dashboard\">\n\n    \u003c!-- Sidebar -->\n    \u003caside class=\"sidebar\">\n\n        \u003cdiv class=\"logo\">\n            \u003ch2>Gentle Fiters\u003c/h2>\n            \u003cp>Garments Management\u003c/p>\n        \u003c/div>\n\n        \u003cnav class=\"sidebar-nav\">\n            \u003ca href=\"index.html\" class=\"nav-link\">\n                \u003cspan>\ud83c\udfe0\u003c/span> Home\u003c/a>\n            \u003ca href=\"products.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\udc55\u003c/span> Products\u003c/a>\n            \u003ca href=\"categories.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\uddc2\ufe0f\u003c/span> Categories\u003c/a>\n            \u003ca href=\"sales.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\uded2\u003c/span> Sales / POS\u003c/a>\n            \u003ca href=\"sales-history.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\udccb\u003c/span> Sales History\u003c/a>\n            \u003ca href=\"customers.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\udc65\u003c/span> Customers\u003c/a>\n            \u003ca href=\"suppliers.html\" class=\"nav-link active\">\n                \u003cspan>\ud83d\ude9a\u003c/span> Suppliers\u003c/a>\n            \u003ca href=\"purchases.html\" class=\"nav-link\">\n                \u003cspan>\ud83e\uddfe\u003c/span> Purchases\u003c/a>\n            \u003ca href=\"expenses.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\udcb8\u003c/span> Expenses\u003c/a>\n            \u003ca href=\"returns.html\" class=\"nav-link\">\n                \u003cspan>\u21a9\ufe0f\u003c/span> Returns\u003c/a>\n            \u003ca href=\"reports.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\udcca\u003c/span> Reports\u003c/a>\n            \u003ca href=\"settings.html\" class=\"nav-link\">\n                \u003cspan>\u2699\ufe0f\u003c/span> Settings\u003c/a>\n        \u003c/nav>\n\n    \u003c/aside>\n\n\n    \u003c!-- Main Content -->\n    \u003cmain class=\"main-content\">\n\n        \u003cheader class=\"topbar\">\n\n            \u003cdiv>\n                \u003ch1>Suppliers\u003c/h1>\n                \u003cp>Manage your garment suppliers\u003c/p>\n            \u003c/div>\n\n        \u003c/header>\n\n\n        \u003csection class=\"page-content\">\n\n            \u003cdiv class=\"page-header\">\n\n                \u003cdiv>\n                    \u003ch2>Suppliers\u003c/h2>\n                    \u003cp>Add and manage your suppliers\u003c/p>\n                \u003c/div>\n\n                \u003cbutton id=\"openSupplierModal\" class=\"primary-btn\">\n                    + Add Supplier\n                \u003c/button>\n\n            \u003c/div>\n\n\n            \u003c!-- Stats -->\n\n            \u003cdiv class=\"stats-grid\">\n\n                \u003cdiv class=\"stat-card\">\n                    \u003ch3>Total Suppliers\u003c/h3>\n                    \u003cp id=\"totalSuppliers\">0\u003c/p>\n                \u003c/div>\n\n                \u003cdiv class=\"stat-card\">\n                    \u003ch3>Total Purchases\u003c/h3>\n                    \u003cp id=\"totalPurchases\">0\u003c/p>\n                \u003c/div>\n\n            \u003c/div>\n\n\n            \u003c!-- Supplier Table -->\n\n            \u003cdiv class=\"table-card\">\n\n                \u003cdiv class=\"table-header\">\n\n                    \u003ch2>Supplier List\u003c/h2>\n\n                    \u003cinput\n                        type=\"text\"\n                        id=\"supplierSearch\"\n                        placeholder=\"Search supplier...\"\n                    >\n\n                \u003c/div>\n\n\n                \u003ctable>\n\n                    \u003cthead>\n\n                        \u003ctr>\n                            \u003cth>#\u003c/th>\n                            \u003cth>Supplier Name\u003c/th>\n                            \u003cth>Company\u003c/th>\n                            \u003cth>Phone\u003c/th>\n                            \u003cth>Email\u003c/th>\n                            \u003cth>Address\u003c/th>\n                            \u003cth>Purchases\u003c/th>\n                            \u003cth>Action\u003c/th>\n                        \u003c/tr>\n\n                    \u003c/thead>\n\n\n                    \u003ctbody id=\"supplierTableBody\">\n                        \u003c!-- Suppliers will appear here -->\n                    \u003c/tbody>\n\n                \u003c/table>\n\n            \u003c/div>\n\n        \u003c/section>\n\n    \u003c/main>\n\n\u003c/div>\n\n\n\u003c!-- Supplier Modal -->\n\n\u003cdiv id=\"supplierModal\" class=\"modal\">\n\n    \u003cdiv class=\"modal-content\">\n\n        \u003cdiv class=\"modal-header\">\n\n            \u003ch2 id=\"supplierModalTitle\">Add Supplier\u003c/h2>\n\n            \u003cbutton id=\"closeSupplierModal\">&times;\u003c/button>\n\n        \u003c/div>\n\n\n        \u003cform id=\"supplierForm\">\n\n            \u003cdiv class=\"form-group\">\n\n                \u003clabel for=\"supplierName\">\n                    Supplier Name\n                \u003c/label>\n\n                \u003cinput\n                    type=\"text\"\n                    id=\"supplierName\"\n                    placeholder=\"Enter supplier name\"\n                    required\n                >\n\n            \u003c/div>\n\n\n            \u003cdiv class=\"form-group\">\n\n                \u003clabel for=\"supplierCompany\">\n                    Company\n                \u003c/label>\n\n                \u003cinput\n                    type=\"text\"\n                    id=\"supplierCompany\"\n                    placeholder=\"Enter company name\"\n                >\n\n            \u003c/div>\n\n\n            \u003cdiv class=\"form-group\">\n\n                \u003clabel for=\"supplierPhone\">\n                    Phone\n                \u003c/label>\n\n                \u003cinput\n                    type=\"text\"\n                    id=\"supplierPhone\"\n                    placeholder=\"03XX-XXXXXXX\"\n                    required\n                >\n\n            \u003c/div>\n\n\n            \u003cdiv class=\"form-group\">\n\n                \u003clabel for=\"supplierEmail\">\n                    Email\n                \u003c/label>\n\n                \u003cinput\n                    type=\"email\"\n                    id=\"supplierEmail\"\n                    placeholder=\"supplier@email.com\"\n                >\n\n            \u003c/div>\n\n\n            \u003cdiv class=\"form-group\">\n\n                \u003clabel for=\"supplierAddress\">\n                    Address\n                \u003c/label>\n\n                \u003cinput\n                    type=\"text\"\n                    id=\"supplierAddress\"\n                    placeholder=\"Enter supplier address\"\n                >\n\n            \u003c/div>\n\n\n            \u003cdiv class=\"modal-actions\">\n\n                \u003cbutton\n                    type=\"button\"\n                    id=\"cancelSupplier\"\n                    class=\"cancel-btn\"\n                >\n                    Cancel\n                \u003c/button>\n\n                \u003cbutton\n                    type=\"submit\"\n                    class=\"primary-btn\"\n                >\n                    Save Supplier\n                \u003c/button>\n\n            \u003c/div>\n\n        \u003c/form>\n\n    \u003c/div>\n\n\u003c/div>\n\n\n\u003cscript>\n/* =====================================\n   DASHBOARD - SAFE DATA HELPERS\n===================================== */\n\nfunction getDashboardData(key) {\n    try {\n        const data = JSON.parse(localStorage.getItem(key) || \"[]\");\n        return Array.isArray(data) ? data : [];\n    } catch (error) {\n        console.error(\"Dashboard data error:\", key, error);\n        return [];\n    }\n}\n\nfunction dashboardMoney(amount) {\n    const value = Number(amount) || 0;\n\n    return \"Rs. \" + value.toLocaleString(\"en-PK\", {\n        maximumFractionDigits: 2\n    });\n}\n\nfunction dashboardDate(dateValue) {\n    if (!dateValue) return null;\n\n    const date = new Date(dateValue);\n\n    return Number.isNaN(date.getTime()) ? null : date;\n}\n\nfunction dashboardSameDay(first, second) {\n    return first.getFullYear() === second.getFullYear() &&\n        first.getMonth() === second.getMonth() &&\n        first.getDate() === second.getDate();\n}\n\nfunction dashboardElement(id) {\n    return document.getElementById(id);\n}\n\n\n/* =====================================\n   DASHBOARD - MAIN STATISTICS\n===================================== */\n\nfunction loadDashboardStats() {\n    const sales = getDashboardData(\"gentleFitersSales\");\n    const products = getDashboardData(\"gentleFitersProducts\");\n\n    const today = new Date();\n\n    const todaysSales = sales.filter(function (sale) {\n        const date = dashboardDate(sale.date);\n        return date && dashboardSameDay(date, today);\n    });\n\n    const todayRevenue = todaysSales.reduce(function (total, sale) {\n        return total + (Number(sale.total) || 0);\n    }, 0);\n\n    const lowStockProducts = products.filter(function (product) {\n        return (Number(product.stock) || 0) \u003c= gfLowStockLimit();\n    });\n\n    const todaySalesElement = dashboardElement(\"todaySalesValue\");\n    const todayOrdersElement = dashboardElement(\"todayOrdersValue\");\n    const totalProductsElement = dashboardElement(\"totalProductsValue\");\n    const lowStockElement = dashboardElement(\"lowStockCount\");\n\n    if (todaySalesElement) {\n        todaySalesElement.textContent = dashboardMoney(todayRevenue);\n    }\n\n    if (todayOrdersElement) {\n        todayOrdersElement.textContent = todaysSales.length;\n    }\n\n    if (totalProductsElement) {\n        totalProductsElement.textContent = products.length;\n    }\n\n    if (lowStockElement) {\n        lowStockElement.textContent = lowStockProducts.length;\n    }\n}\n\n\n/* =====================================\n   DASHBOARD - LOW STOCK ALERTS\n===================================== */\n\nfunction loadDashboardLowStock() {\n    const container = dashboardElement(\"lowStockList\");\n\n    if (!container) return;\n\n    const products = getDashboardData(\"gentleFitersProducts\");\n\n    const lowStockProducts = products\n        .filter(function (product) {\n            return (Number(product.stock) || 0) \u003c= gfLowStockLimit();\n        })\n        .sort(function (a, b) {\n            return (Number(a.stock) || 0) -\n                (Number(b.stock) || 0);\n        })\n        .slice(0, 5);\n\n    container.replaceChildren();\n\n    if (lowStockProducts.length === 0) {\n        const message = document.createElement(\"p\");\n        message.textContent =\n            \"No low-stock products. Inventory looks good!\";\n        container.appendChild(message);\n        return;\n    }\n\n    lowStockProducts.forEach(function (product) {\n        const item = document.createElement(\"div\");\n        item.className = \"stock-item\";\n\n        const details = document.createElement(\"div\");\n\n        const name = document.createElement(\"strong\");\n        name.textContent = product.name || \"Unnamed Product\";\n\n        const description = document.createElement(\"span\");\n        const extraDetails = [product.size, product.color]\n            .filter(Boolean)\n            .join(\" / \");\n\n        description.textContent = extraDetails || \"Inventory alert\";\n\n        const stock = document.createElement(\"b\");\n        stock.textContent =\n            (Number(product.stock) || 0) + \" left\";\n\n        details.appendChild(name);\n        details.appendChild(description);\n\n        item.appendChild(details);\n        item.appendChild(stock);\n\n        container.appendChild(item);\n    });\n}\n\n\n/* =====================================\n   DASHBOARD - RECENT SALES\n===================================== */\n\nfunction loadDashboardRecentSales() {\n    const tbody = dashboardElement(\"recentSalesBody\");\n\n    if (!tbody) return;\n\n    const sales = getDashboardData(\"gentleFitersSales\");\n\n    const recentSales = sales.slice().sort(function (a, b) {\n        const dateA = dashboardDate(a.date);\n        const dateB = dashboardDate(b.date);\n\n        return (dateB ? dateB.getTime() : Number(b.id) || 0) -\n            (dateA ? dateA.getTime() : Number(a.id) || 0);\n    }).slice(0, 5);\n\n    tbody.replaceChildren();\n\n    if (recentSales.length === 0) {\n        const row = document.createElement(\"tr\");\n        const cell = document.createElement(\"td\");\n\n        cell.colSpan = 5;\n        cell.textContent = \"No sales recorded yet.\";\n\n        row.appendChild(cell);\n        tbody.appendChild(row);\n        return;\n    }\n\n    recentSales.forEach(function (sale) {\n        const row = document.createElement(\"tr\");\n\n        const saleId = document.createElement(\"td\");\n        saleId.textContent = sale.id ? String(sale.id) : \"\u2014\";\n\n        const dateCell = document.createElement(\"td\");\n        const date = dashboardDate(sale.date);\n\n        dateCell.textContent = date\n            ? date.toLocaleDateString()\n            : \"\u2014\";\n\n        const customerCell = document.createElement(\"td\");\n        customerCell.textContent =\n            sale.customerName || \"Walk-in Customer\";\n\n        const itemsCell = document.createElement(\"td\");\n        const itemCount = Array.isArray(sale.items)\n            ? sale.items.reduce(function (total, item) {\n                return total + (Number(item.quantity) || 0);\n            }, 0)\n            : 0;\n\n        itemsCell.textContent = itemCount;\n\n        const totalCell = document.createElement(\"td\");\n        totalCell.textContent = dashboardMoney(sale.total);\n\n        row.appendChild(saleId);\n        row.appendChild(dateCell);\n        row.appendChild(customerCell);\n        row.appendChild(itemsCell);\n        row.appendChild(totalCell);\n\n        tbody.appendChild(row);\n    });\n}\n\n\n/* =====================================\n   DASHBOARD - SALES CHART\n===================================== */\n\nfunction loadDashboardChart() {\n    const chart = dashboardElement(\"salesChart\");\n    const periodSelect = dashboardElement(\"salesPeriod\");\n\n    if (!chart) return;\n\n    const sales = getDashboardData(\"gentleFitersSales\");\n    const period = periodSelect ? periodSelect.value : \"7\";\n    const today = new Date();\n\n    let buckets = [];\n\n    if (period === \"year\") {\n        for (let month = 0; month \u003c 12; month++) {\n            buckets.push({\n                label: new Date(today.getFullYear(), month, 1)\n                    .toLocaleDateString(\"en\", { month: \"short\" }),\n                start: new Date(today.getFullYear(), month, 1),\n                end: new Date(today.getFullYear(), month + 1, 1),\n                total: 0\n            });\n        }\n    } else {\n        const days = period === \"30\" ? 30 : 7;\n\n        for (let i = days - 1; i >= 0; i--) {\n            const date = new Date(today);\n            date.setHours(0, 0, 0, 0);\n            date.setDate(date.getDate() - i);\n\n            const end = new Date(date);\n            end.setDate(end.getDate() + 1);\n\n            buckets.push({\n                label: period === \"30\"\n                    ? date.getDate() + \"/\" + (date.getMonth() + 1)\n                    : date.toLocaleDateString(\"en\", {\n                        weekday: \"short\"\n                    }),\n                start: date,\n                end: end,\n                total: 0\n            });\n        }\n    }\n\n    sales.forEach(function (sale) {\n        const date = dashboardDate(sale.date);\n\n        if (!date) return;\n\n        buckets.forEach(function (bucket) {\n            if (date >= bucket.start && date \u003c bucket.end) {\n                bucket.total += Number(sale.total) || 0;\n            }\n        });\n    });\n\n    chart.replaceChildren();\n\n    const maxTotal = Math.max(\n        ...buckets.map(function (bucket) {\n            return bucket.total;\n        }),\n        1\n    );\n\n    buckets.forEach(function (bucket) {\n        const column = document.createElement(\"div\");\n\n        column.style.display = \"flex\";\n
