t = dashboardMoney(sale.total);\n\n        row.appendChild(saleId);\n        row.appendChild(dateCell);\n        row.appendChild(customerCell);\n        row.appendChild(itemsCell);\n        row.appendChild(totalCell);\n\n        tbody.appendChild(row);\n    });\n}\n\n\n/* =====================================\n   DASHBOARD - SALES CHART\n===================================== */\n\nfunction loadDashboardChart() {\n    const chart = dashboardElement(\"salesChart\");\n    const periodSelect = dashboardElement(\"salesPeriod\");\n\n    if (!chart) return;\n\n    const sales = getDashboardData(\"gentleFitersSales\");\n    const period = periodSelect ? periodSelect.value : \"7\";\n    const today = new Date();\n\n    let buckets = [];\n\n    if (period === \"year\") {\n        for (let month = 0; month \u003c 12; month++) {\n            buckets.push({\n                label: new Date(today.getFullYear(), month, 1)\n                    .toLocaleDateString(\"en\", { month: \"short\" }),\n                start: new Date(today.getFullYear(), month, 1),\n                end: new Date(today.getFullYear(), month + 1, 1),\n                total: 0\n            });\n        }\n    } else {\n        const days = period === \"30\" ? 30 : 7;\n\n        for (let i = days - 1; i >= 0; i--) {\n            const date = new Date(today);\n            date.setHours(0, 0, 0, 0);\n            date.setDate(date.getDate() - i);\n\n            const end = new Date(date);\n            end.setDate(end.getDate() + 1);\n\n            buckets.push({\n                label: period === \"30\"\n                    ? date.getDate() + \"/\" + (date.getMonth() + 1)\n                    : date.toLocaleDateString(\"en\", {\n                        weekday: \"short\"\n                    }),\n                start: date,\n                end: end,\n                total: 0\n            });\n        }\n    }\n\n    sales.forEach(function (sale) {\n        const date = dashboardDate(sale.date);\n\n        if (!date) return;\n\n        buckets.forEach(function (bucket) {\n            if (date >= bucket.start && date \u003c bucket.end) {\n                bucket.total += Number(sale.total) || 0;\n            }\n        });\n    });\n\n    chart.replaceChildren();\n\n    const maxTotal = Math.max(\n        ...buckets.map(function (bucket) {\n            return bucket.total;\n        }),\n        1\n    );\n\n    buckets.forEach(function (bucket) {\n        const column = document.createElement(\"div\");\n\n        column.style.display = \"flex\";\n        column.style.flexDirection = \"column\";\n        column.style.alignItems = \"center\";\n        column.style.justifyContent = \"flex-end\";\n        column.style.flex = \"1\";\n        column.style.minWidth = \"0\";\n        column.style.height = \"100%\";\n\n        const bar = document.createElement(\"div\");\n        bar.className = \"bar\";\n\n        bar.style.width =\n            period === \"30\" || period === \"year\" ? \"65%\" : \"35px\";\n\n        const height = bucket.total > 0\n            ? Math.max((bucket.total / maxTotal) * 85, 4)\n            : 2;\n\n        bar.style.height = height + \"%\";\n        bar.style.minHeight = \"2px\";\n        bar.title = bucket.label + \": \" +\n            dashboardMoney(bucket.total);\n\n        const label = document.createElement(\"span\");\n        label.textContent = bucket.label;\n\n        column.appendChild(bar);\n        column.appendChild(label);\n\n        chart.appendChild(column);\n    });\n}\n\n\n/* =====================================\n   INITIALIZE DASHBOARD\n===================================== */\n\nfunction loadDashboard() {\n    if (!dashboardElement(\"todaySalesValue\")) return;\n\n    loadDashboardStats();\n    loadDashboardLowStock();\n    loadDashboardRecentSales();\n    loadDashboardChart();\n}\n\nloadDashboard();\n\nconst dashboardPeriod = dashboardElement(\"salesPeriod\");\n\nif (dashboardPeriod) {\n    dashboardPeriod.addEventListener(\"change\", loadDashboardChart);\n}\n\n\n/* =====================================\n   GENTLE FITERS - SIDEBAR SCROLL\n===================================== */\n\n(function () {\n    const storageKey = \"gentleFitersSidebarScroll\";\n\n    function setupSidebarScroll() {\n        const sidebarNav = document.querySelector(\".sidebar-nav\");\n\n        if (!sidebarNav) return;\n\n        function saveSidebarScroll() {\n            try {\n                sessionStorage.setItem(\n                    storageKey,\n                    String(sidebarNav.scrollTop)\n                );\n            } catch (error) {\n                console.warn(\"Could not save sidebar position.\", error);\n            }\n        }\n\n        function restoreSidebarScroll() {\n            try {\n                const savedPosition = Number(\n                    sessionStorage.getItem(storageKey)\n                ) || 0;\n\n                const maxScroll = Math.max(\n                    0,\n                    sidebarNav.scrollHeight - sidebarNav.clientHeight\n                );\n\n                sidebarNav.scrollTop = Math.min(\n                    savedPosition,\n                    maxScroll\n                );\n            } catch (error) {\n                console.warn(\"Could not restore sidebar position.\", error);\n            }\n        }\n\n        // Save position when a sidebar link is clicked.\n        sidebarNav.addEventListener(\"click\", function (event) {\n            const link = event.target.closest(\"a.nav-link\");\n\n            if (link && sidebarNav.contains(link)) {\n                saveSidebarScroll();\n            }\n        }, true);\n\n        // Save the latest position before leaving the page.\n        window.addEventListener(\"pagehide\", saveSidebarScroll);\n\n        // Restore after page load and layout calculations.\n        function restoreSeveralTimes() {\n            restoreSidebarScroll();\n\n            requestAnimationFrame(function () {\n                restoreSidebarScroll();\n\n                requestAnimationFrame(function () {\n                    restoreSidebarScroll();\n                });\n            });\n\n            setTimeout(restoreSidebarScroll, 100);\n            setTimeout(restoreSidebarScroll, 300);\n            setTimeout(restoreSidebarScroll, 700);\n        }\n\n        if (document.readyState === \"complete\") {\n            restoreSeveralTimes();\n        } else {\n            window.addEventListener(\n                \"load\",\n                restoreSeveralTimes,\n                { once: true }\n            );\n        }\n    }\n\n    if (document.readyState === \"loading\") {\n        document.addEventListener(\n            \"DOMContentLoaded\",\n            setupSidebarScroll,\n            { once: true }\n        );\n    } else {\n        setupSidebarScroll();\n    }\n})();\n\n/* =====================================\n   GENTLE FITERS - SHARED HELPERS (all pages)\n===================================== */\n\n// Escape user text before putting it inside innerHTML.\nfunction gfEscape(value) {\n    return String(value === undefined || value === null ? \"\" : value)\n        .replace(/&/g, \"&amp;\")\n        .replace(/\u003c/g, \"&lt;\")\n        .replace(/>/g, \"&gt;\")\n        .replace(/\"/g, \"&quot;\")\n        .replace(/'/g, \"&#39;\");\n}\n\n// Low-stock limit comes from Settings > Inventory (default 5).\nfunction gfLowStockLimit() {\n    try {\n        const saved = JSON.parse(localStorage.getItem(\"gentleFitersSettings\") || \"{}\");\n        const limit = Number(saved && saved.inventory && saved.inventory.lowStockThreshold);\n        return Number.isFinite(limit) && limit >= 0 ? limit : 5;\n    } catch (error) {\n        return 5;\n    }\n}\n\nfunction gfRead(key) {\n    try {\n        const data = JSON.parse(localStorage.getItem(key) || \"[]\");\n        return Array.isArray(data) ? data : [];\n    } catch (error) {\n        return [];\n    }\n}\n\n// Default categories are created once, so the Categories page and the\n// Products page always share the same list.\n(function seedCategories() {\n    try {\n        if (localStorage.getItem(\"gentleFitersCategories\") !== null) return;\n\n        const names = [\"T-Shirts\", \"Shirts\", \"Jeans\", \"Trousers\", \"Jackets\"];\n        gfRead(\"gentleFitersProducts\").forEach(function (product) {\n            if (product.category && names.indexOf(product.category) === -1) {\n                names.push(product.category);\n            }\n        });\n\n        localStorage.setItem(\"gentleFitersCategories\", JSON.stringify(\n            names.map(function (name, index) {\n                return { id: Date.now() + index, name: name };\n            })\n        ));\n    } catch (error) {\n        console.warn(\"Could not seed categories.\", error);\n    }\n})();\n\n// Fill the category dropdowns on the Products page from saved categories.\nfunction gfFillCategorySelects() {\n    const names = gfRead(\"gentleFitersCategories\").map(function (c) { return c.name; });\n\n    gfRead(\"gentleFitersProducts\").forEach(function (product) {\n        if (product.category && names.indexOf(product.category) === -1) {\n            names.push(product.category);\n        }\n    });\n\n    [[\"productCategory\", \"Select Category\", \"\"], [\"categoryFilter\", \"All Categories\", \"all\"]]\n        .forEach(function (config) {\n            const select = document.getElementById(config[0]);\n            if (!select) return;\n\n            const previous = select.value;\n            select.replaceChildren();\n\n            const first = document.createElement(\"option\");\n            first.value = config[2];\n            first.textContent = config[1];\n            select.appendChild(first);\n\n            names.forEach(function (name) {\n                const option = document.createElement(\"option\");\n                option.value = name;\n                option.textContent = name;\n                select.appendChild(option);\n            });\n\n            select.value = previous;\n        });\n}\ngfFillCategorySelects();\n\n\n/* =====================================\n   GENTLE FITERS - NAVIGATION\n===================================== */\n\n(function setupNavigation() {\n    function init() {\n        // Make sure the right sidebar link is highlighted on every page.\n        const current = (location.pathname.split(\"/\").pop() || \"index.html\").toLowerCase();\n        document.querySelectorAll(\".sidebar-nav a.nav-link\").forEach(function (link) {\n            const target = (link.getAttribute(\"href\") || \"\").toLowerCase();\n            link.classList.toggle(\"active\", target === current);\n        });\n\n        // Browser tab title shows the current page name.\n        const heading = document.querySelector(\".topbar h1\");\n        if (heading && heading.textContent.trim()) {\n            document.title = heading.textContent.trim() + \" | Gentle Fiters\";\n        }\n\n        // Notification bell: shows low-stock count and opens Products.\n        const bell = document.querySelector(\".notification\");\n        if (bell) {\n            const low = gfRead(\"gentleFitersProducts\").filter(function (p) {\n                return (Number(p.stock) || 0) \u003c= gfLowStockLimit();\n            }).length;\n\n            bell.style.cursor = \"pointer\";\n            bell.style.position = \"relative\";\n            bell.setAttribute(\"role\", \"link\");\n            bell.title = low ? low + \" product(s) low on stock\" : \"No stock alerts\";\n\n            if (low > 0) {\n                const badge = document.createElement(\"span\");\n                badge.textContent = low > 99 ? \"99+\" : low;\n                badge.style.cssText = \"position:absolute;top:-6px;right:-8px;background:#ef4444;\" +\n                    \"color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;\" +\n                    \"border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;\";\n                bell.appendChild(badge);\n            }\n\n            bell.addEventListener(\"click\", function () {\n                window.location.href = \"products.html\";\n            });\n        }\n    }\n\n    if (document.readyState === \"loading\") {\n        document.addEventListener(\"DOMContentLoaded\", init, { once: true });\n    } else {\n        init();\n    }\n})();\n\u003c/script>\n\n    \u003c!-- Expenses Script -->\n    \u003cscript>// ==========================================\n// Gentle Fiters - Expenses\n// ==========================================\n\nlet expenses = JSON.parse(\n    localStorage.getItem(\"gentleFitersExpenses\")\n) || [];\n\n\n// ==========================================\n// Elements\n// ==========================================\n\nconst expenseModal = document.getElementById(\"expenseModal\");\nconst openExpenseModal = document.getElementById(\"openExpenseModal\");\nconst closeExpenseModal = document.getElementById(\"closeExpenseModal\");\nconst cancelExpense = document.getElementById(\"cancelExpense\");\n\nconst expenseForm = document.getElementById(\"expenseForm\");\n\nconst expenseModalTitle =\n    document.getElementById(\"expenseModalTitle\");\n\nconst expenseCategory =\n    document.getElementById(\"expenseCategory\");\n\nconst expenseDescription =\n    document.getElementById(\"expenseDescription\");\n\nconst expenseAmount =\n    document.getElementById(\"expenseAmount\");\n\nconst expenseDate =\n    document.getElementById(\"expenseDate\");\n\nconst expenseNotes =\n    document.getElementById(\"expenseNotes\");\n\nconst expenseTableBody =\n    document.getElementById(\"expenseTableBody\");\n\nconst expenseSearch =\n    document.getElementById(\"expenseSearch\");\n\nconst expenseCategoryFilter =\n    document.getElementById(\"expenseCategoryFilter\");\n\nconst totalExpenses =\n    document.getElementById(\"totalExpenses\");\n\nconst monthlyExpenses =\n    document.getElementById(\"monthlyExpenses\");\n\nconst expenseCount =\n    document.getElementById(\"expenseCount\");\n\n\n// ==========================================\n// Edit State\n// ==========================================\n\nlet editingExpenseId = null;\n\n\n// ==========================================\n// Save Expenses\n// ==========================================\n\nfunction saveExpenses() {\n\n    localStorage.setItem(\n        \"gentleFitersExpenses\",\n        JSON.stringify(expenses)\n    );\n\n}\n\n\n// ==========================================\n// Open Add Expense Modal\n// ==========================================\n\nopenExpenseModal.addEventListener(\n    \"click\",\n    function () {\n\n        editingExpenseId = null;\n\n        expenseModalTitle.textContent =\n            \"Add Expense\";\n\n        expenseForm.reset();\n\n        setTodayDate();\n\n        expenseModal.classList.add(\"active\");\n\n    }\n);\n\n\n// ==========================================\n// Close Modal\n// ==========================================\n\nfunction closeExpenseModalFunction() {\n\n    expenseModal.classList.remove(\"active\");\n\n    expenseForm.reset();\n\n    editingExpenseId = null;\n\n}\n\n\ncloseExpenseModal.addEventListener(\n    \"click\",\n    closeExpenseModalFunction\n);\n\n\ncancelExpense.addEventListener(\n    \"click\",\n    closeExpenseModalFunction\n);\n\n\n// ==========================================\n// Set Today's Date\n// ==========================================\n\nfunction setTodayDate() {\n\n    const today = new Date();\n\n    const year = today.getFullYear();\n\n    const month = String(\n        today.getMonth() + 1\n    ).padStart(2, \"0\");\n\n    const day = String(\n        today.getDate()\n    ).padStart(2, \"0\");\n\n    expenseDate.value =\n        `${year}-${month}-${day}`;\n\n}\n\n\n// ==========================================\n// Add / Edit Expense\n// ==========================================\n\nexpenseForm.addEventListener(\n    \"submit\",\n    function (event) {\n\n        event.preventDefault();\n\n\n        const category =\n            expenseCategory.value.trim();\n\n        const description =\n            expenseDescription.value.trim();\n\n        const amount =\n            Number(expenseAmount.value);\n\n        const date =\n            expenseDate.value;\n\n        const notes =\n            expenseNotes.value.trim();\n\n\n        if (!category) {\n\n            alert(\"Please select an expense category.\");\n\n            return;\n\n        }\n\n\n        if (!description) {\n\n            alert(\"Please enter expense description.\");\n\n            return;\n\n        }\n\n\n        if (!amount || amount \u003c= 0) {\n\n            alert(\"Please enter a valid expense amount.\");\n\n            return;\n\n        }\n\n\n        if (!date) {\n\n            alert(\"Please select expense date.\");\n\n            return;\n\n        }\n\n\n        // ==========================================\n        // Edit Existing Expense\n        // ==========================================\n\n        if (editingExpenseId !== null) {\n\n            const expense =\n                expenses.find(function (item) {\n\n                    return item.id === editingExpenseId;\n\n                });\n\n\n            if (expense) {\n\n                expense.category = category;\n\n                expense.description = description;\n\n                expense.amount = amount;\n\n                expense.date = date;\n\n                expense.notes = notes;\n\n            }\n\n        }\n\n\n        // ==========================================\n        // Add New Expense\n        // ==========================================\n\n        else {\n\n            const newExpense = {\n\n                id: Date.now(),\n\n                category: category,\n\n                description: description,\n\n                amount: amount,\n\n                date: date,\n\n                notes: notes\n\n            };\n\n\n            expenses.unshift(newExpense);\n\n        }\n\n\n        saveExpenses();\n\n        closeExpenseModalFunction();\n\n        renderExpenses();\n\n    }\n);\n\n\n// ==========================================\n// Render Expenses\n// ==========================================\n\nfunction renderExpenses() {\n\n    expenseTableBody.innerHTML = \"\";\n\n\n    const searchTerm =\n        expenseSearch.value\n            .trim()\n            .toLowerCase();\n\n\n    const selectedCategory =\n        expenseCategoryFilter.value;\n\n\n    const filteredExpenses =\n        expenses.filter(function (expense) {\n\n            const matchesSearch =\n                expense.description\n                    .toLowerCase()\n                    .includes(searchTerm) ||\n\n                expense.category\n                    .toLowerCase()\n                    .includes(searchTerm);\n\n\n            const matchesCategory =\n                selectedCategory === \"\" ||\n                expense.category === selectedCategory;\n\n\n            return (\n                matchesSearch &&\n                matchesCategory\n            );\n\n        });\n\n\n    if (filteredExpenses.length === 0) {\n\n        expenseTableBody.innerHTML = `\n\n            \u003ctr>\n\n                \u003ctd colspan=\"6\">\n\n                    \u003cdiv class=\"empty-expenses\">\n\n                        \u003cp>\n                            No expenses found\n                        \u003c/p>\n\n                        \u003cspan>\n                            Add your first expense to get started.\n                        \u003c/span>\n\n                    \u003c/div>\n\n                \u003c/td>\n\n            \u003c/tr>\n\n        `;\n\n        updateStats();\n\n        return;\n\n    }\n\n\n    filteredExpenses.forEach(\n        function (expense) {\n\n            const row =\n                document.createElement(\"tr\");\n\n\n            row.innerHTML = `\n\n                \u003ctd class=\"expense-id\">\n                    #${expense.id}\n                \u003c/td>\n\n                \u003ctd>\n                    ${formatDate(expense.date)}\n                \u003c/td>\n\n                \u003ctd>\n                    ${gfEscape(expense.category)}\n                \u003c/td>\n\n                \u003ctd>\n                    ${gfEscape(expense.description)}\n                \u003c/td>\n\n                \u003ctd class=\"expense-amount\">\n                    Rs. ${Number(expense.amount).toFixed(2)}\n                \u003c/td>\n\n                \u003ctd>\n\n                    \u003cbutton\n                        class=\"edit-expense-btn\"\n                        onclick=\"editExpense(${expense.id})\"\n                    >\n                        Edit\n                    \u003c/button>\n\n                    \u003cbutton\n                        class=\"delete-expense-btn\"\n                        onclick=\"deleteExpense(${expense.id})\"\n                    >\n                        Delete\n                    \u003c/button>\n\n                \u003c/td>\n\n            `;\n\n\n            expenseTableBody.appendChild(row);\n\n        }\n    );\n\n\n    updateStats();\n\n}\n\n\n// ==========================================\n// Format Date\n// ==========================================\n\nfunction formatDate(dateString) {\n\n    const date =\n        new Date(dateString + \"T00:00:00\");\n\n\n    return date.toLocaleDateString();\n\n}\n\n\n// ==========================================\n// Update Statistics\n// ==========================================\n\nfunction updateStats() {\n\n    let total = 0;\n\n    let monthlyTotal = 0;\n\n\n    const now = new Date();\n\n    const currentMonth =\n        now.getMonth();\n\n    const currentYear =\n        now.getFullYear();\n\n\n    expenses.forEach(\n        function (expense) {\n\n            const amount =\n                Number(expense.amount);\n\n\n            total += amount;\n\n\n            const expenseDate =\n                new Date(\n                    expense.date + \"T00:00:00\"\n                );\n\n\n            if (\n                expenseDate.getMonth() === currentMonth &&\n                expenseDate.getFullYear() === currentYear\n            ) {\n\n                monthlyTotal += amount;\n\n            }\n\n        }\n    );\n\n\n    totalExpenses.textContent =\n        \"Rs. \" + total.toFixed(2);\n\n\n    monthlyExpenses.textContent =\n        \"Rs. \" + monthlyTotal.toFixed(2);\n\n\n    expenseCount.textContent =\n        expenses.length;\n\n}\n\n\n// ==========================================\n// Search\n// ==========================================\n\nexpenseSearch.addEventListener(\n    \"input\",\n    function () {\n\n        renderExpenses();\n\n    }\n);\n\n\n// ==========================================\n// Category Filter\n// ==========================================\n\nexpenseCategoryFilter.addEventListener(\n    \"change\",\n    function () {\n\n        renderExpenses();\n\n    }\n);\n\n\n// ==========================================\n// Edit Expense\n// ==========================================\n\nfunction editExpense(id) {\n\n    const expense =\n        expenses.find(function (item) {\n\n            return item.id === id;\n\n        });\n\n\n    if (!expense) {\n\n        return;\n\n    }\n\n\n    editingExpenseId = id;\n\n\n    expenseModalTitle.textContent =\n        \"Edit Expense\";\n\n\n    expenseCategory.value =\n        expense.category;\n\n    expenseDescription.value =\n        expense.description;\n\n    expenseAmount.value =\n        expense.amount;\n\n    expenseDate.value =\n        expense.date;\n\n    expenseNotes.value =\n        expense.notes || \"\";\n\n\n    expenseModal.classList.add(\"active\");\n\n}\n\n\n// ==========================================\n// Delete Expense\n// ==========================================\n\nfunction deleteExpense(id) {\n\n    const confirmDelete =\n        confirm(\n            \"Are you sure you want to delete this expense?\"\n        );\n\n\n    if (!confirmDelete) {\n\n        return;\n\n    }\n\n\n    expenses =\n        expenses.filter(function (expense) {\n\n            return expense.id !== id;\n\n        });\n\n\n    saveExpenses();\n\n    renderExpenses();\n\n}\n\n\n// ==========================================\n// Close Modal When Clicking Outside\n// ==========================================\n\nexpenseModal.addEventListener(\n    \"click\",\n    function (event) {\n\n        if (event.target === expenseModal) {\n\n            closeExpenseModalFunction();\n\n        }\n\n    }\n);\n\n\n// ==========================================\n// Initial Load\n// ==========================================\n\nrenderExpenses();\u003c/script>\n\n\u003cscript>document.addEventListener(\"click\",function(e){var a=e.target.closest(\"a[href$=\\\".html\\\"]\");if(a){e.preventDefault();parent.postMessage({gfPage:a.getAttribute(\"href\")},\"*\");}});\u003c/script>\u003c/body>\n\n\u003c/html>", "products.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\n\u003chead>\n\n    \u003cmeta charset=\"UTF-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\n    \u003ctitle>Products - Gentle Fiters\u003c/title>\n\n    \u003cstyle>* {\n    margin: 0;\n    padding: 0;\n    box-sizing: border-box;\n}\nya lo complete css \nbody {\n    font-family: Arial, sans-serif;\n    background: #f5f7fb;\n    color: #1f2937;\n}\n\n\n/* =========================\n   Sidebar\n========================= */\n\n.sidebar {\n    width: 250px;\n    height: 100vh;\n    background: #111827;\n    color: white;\n\n    position: fixed;\n    left: 0;\n    top: 0;\n\n    padding: 25px 15px;\n\n    display: flex;\n    flex-direction: column;\n\n    /* Sidebar itself will NOT scroll */\n    overflow: hidden;\n}\n\n\n/* =========================\n   Logo\n========================= */\n\n.logo {\n    padding: 0 12px 30px;\n    border-bottom: 1px solid #374151;\n    flex-shrink: 0;\n}\n\n.logo h2 {\n    font-size: 28px;\n}\n\n.logo span {\n    font-size: 12px;\n    color: #9ca3af;\n}\n\n\n/* =========================\n   Navigation\n========================= */\n\n.sidebar-nav {\n    margin-top: 25px;\n\n    /* Take all remaining sidebar height */\n    flex: 1 1 auto;\n\n    /* VERY IMPORTANT for flex scrolling */\n    min-height: 0;\n\n    /* Only navigation scrolls */\n    overflow-y: auto;\n    overflow-x: hidden;\n\n    padding-right: 5px;\n}\n\n\n/* =========================\n   Navigation Scrollbar\n========================= */\n\n.sidebar-nav::-webkit-scrollbar {\n    width: 6px;\n}\n\n.sidebar-nav::-webkit-scrollbar-track {\n    background: transparent;\n}\n\n.sidebar-nav::-webkit-scrollbar-thumb {\n    background: #374151;\n    border-radius: 10px;\n}\n\n.sidebar-nav::-webkit-scrollbar-thumb:hover {\n    background: #4b5563;\n}\n\n\n/* =========================\n   Navigation Links\n========================= */\n\n.nav-link {\n    display: flex;\n    align-items: center;\n    gap: 12px;\n\n    color: #d1d5db;\n    text-decoration: none;\n\n    padding: 12px;\n\n    border-radius: 8px;\n    margin-bottom: 6px;\n\n    font-size: 14px;\n}\n\n.nav-link:hover,\n.nav-link.active {\n    background: #2563eb;\n    color: white;\n}\n\n.nav-link span {\n    width: 22px;\n    flex-shrink: 0;\n}\n\n\n/* =========================\n   Sidebar Bottom\n========================= */\n\n.sidebar-bottom {\n    margin-top: 15px;\n\n    padding: 15px 10px 5px;\n\n    color: #6b7280;\n    font-size: 12px;\n\n    border-top: 1px solid #374151;\n\n    /* Footer stays at bottom */\n    flex-shrink: 0;\n}\n\n\n/* =========================\n   Main\n========================= */\n\n.main-content {\n    margin-left: 250px;\n    min-height: 100vh;\n}\n\n\n/* =========================\n   Topbar\n========================= */\n\n.topbar {\n    height: 85px;\n    background: white;\n    border-bottom: 1px solid #e5e7eb;\n\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n\n    padding: 0 30px;\n}\n\n.topbar h1 {\n    font-size: 24px;\n    margin-bottom: 4px;\n}\n\n.topbar p {\n    font-size: 13px;\n    color: #6b7280;\n}\n\n.user-area {\n    display: flex;\n    align-items: center;\n    gap: 15px;\n}\n\n.notification {\n    font-size: 20px;\n}\n\n.user-info {\n    display: flex;\n    flex-direction: column;\n    gap: 3px;\n}\n\n.user-info strong {\n    font-size: 14px;\n}\n\n.user-info span {\n    font-size: 12px;\n    color: #6b7280;\n}\n\n\n/* =========================\n   Dashboard\n========================= */\n\n.dashboard {\n    padding: 30px;\n}\n\n\n/* =========================\n   Stats\n========================= */\n\n.stats-grid {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 20px;\n}\n\n.stat-card {\n    background: white;\n    border: 1px solid #e5e7eb;\n    border-radius: 12px;\n\n    padding: 22px;\n\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n}\n\n.stat-card p {\n    color: #6b7280;\n    font-size: 13px;\n    margin-bottom: 8px;\n}\n\n.stat-card h2 {\n    font-size: 22px;\n    margin-bottom: 8px;\n}\n\n.stat-card span {\n    font-size: 12px;\n    color: #6b7280;\n}\n\n.stat-card .positive {\n    color: #16a34a;\n}\n\n.stat-icon {\n    font-size: 25px;\n    background: #eff6ff;\n    padding: 12px;\n    border-radius: 10px;\n}\n\n\n/* =========================\n   Cards\n========================= */\n\n.card {\n    background: white;\n    border: 1px solid #e5e7eb;\n    border-radius: 12px;\n    padding: 22px;\n}\n\n.dashboard-grid {\n    display: grid;\n    grid-template-columns: 2fr 1fr;\n    gap: 20px;\n    margin-top: 20px;\n}\n\n.card-header {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    margin-bottom: 25px;\n}\n\n.card-header h3 {\n    font-size: 17px;\n    margin-bottom: 5px;\n}\n\n.card-header p {\n    font-size: 12px;\n    color: #6b7280;\n}\n\n.card-header select {\n    border: 1px solid #d1d5db;\n    padding: 8px 10px;\n    border-radius: 6px;\n}\n\n\n/* =========================\n   Chart\n========================= */\n\n.chart {\n    height: 250px;\n\n    display: flex;\n    align-items: flex-end;\n    justify-content: space-around;\n\n    gap: 15px;\n\n    border-bottom: 1px solid #e5e7eb;\n\n    padding: 20px 10px 0;\n}\n\n.bar {\n    width: 35px;\n\n    background: #2563eb;\n\n    border-radius: 6px 6px 0 0;\n\n    position: relative;\n\n    min-height: 20px;\n}\n\n.bar span {\n    position: absolute;\n\n    top: 105%;\n    left: 50%;\n\n    transform: translateX(-50%);\n\n    font-size: 11px;\n\n    color: #6b7280;\n}\n\n\n/* =========================\n   Stock\n========================= */\n\n.stock-list {\n    display: flex;\n    flex-direction: column;\n    gap: 15px;\n}\n\n.stock-item {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n\n    padding-bottom: 14px;\n\n    border-bottom: 1px solid #f0f0f0;\n}\n\n.stock-item div {\n    display: flex;\n    flex-direction: column;\n    gap: 5px;\n}\n\n.stock-item strong {\n    font-size: 13px;\n}\n\n.stock-item span {\n    font-size: 11px;\n    color: #6b7280;\n}\n\n.stock-item b {\n    font-size: 12px;\n    color: #dc2626;\n}\n\n.view-btn {\n    border: none;\n\n    background: #eff6ff;\n    color: #2563eb;\n\n    padding: 8px 12px;\n\n    border-radius: 6px;\n\n    cursor: pointer;\n}\n\n\n/* =========================\n   Recent Orders\n========================= */\n\n.recent-orders {\n    margin-top: 20px;\n}\n\n.table-wrapper {\n    overflow-x: auto;\n}\n\ntable {\n    width: 100%;\n    border-collapse: collapse;\n}\n\nth,\ntd {\n    padding: 14px 10px;\n\n    text-align: left;\n\n    border-bottom: 1px solid #f0f0f0;\n\n    font-size: 13px;\n}\n\nth {\n    color: #6b7280;\n\n    font-size: 12px;\n\n    font-weight: 600;\n}\n\n.status {\n    padding: 5px 9px;\n\n    border-radius: 20px;\n\n    font-size: 11px;\n}\n\n.completed {\n    background: #dcfce7;\n    color: #15803d;\n}\n\n.pending {\n    background: #fef3c7;\n    color: #b45309;\n}\n\n\n/* =========================\n   Responsive\n========================= */\n\n@media (max-width: 1100px) {\n\n    .stats-grid {\n        grid-template-columns: repeat(2, 1fr);\n    }\n\n    .dashboard-grid {\n        grid-template-columns: 1fr;\n    }\n}\n\n\n/* =========================\n   Mobile\n========================= */\n\n@media (max-width: 700px) {\n\n    .sidebar {\n        width: 70px;\n        padding: 20px 8px;\n    }\n\n    .logo span,\n    .logo h2 {\n        display: none;\n    }\n\n    .sidebar-nav {\n        padding-right: 0;\n    }\n\n    .nav-link {\n        justify-content: center;\n        font-size: 0;\n    }\n\n    .nav-link span {\n        font-size: 18px;\n    }\n\n    .main-content {\n        margin-left: 70px;\n    }\n\n    .topbar {\n        padding: 0 15px;\n    }\n\n    .dashboard {\n        padding: 15px;\n    }\n\n    .stats-grid {\n        grid-template-columns: 1fr;\n    }\n}\u003c/style>\n    \u003cstyle>.products-page {\n    padding: 30px;\n}\n\n.products-heading {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    margin-bottom: 25px;\n}\n\n.products-heading h2 {\n    font-size: 22px;\n    margin-bottom: 5px;\n}\n\n.products-heading p {\n    color: #6b7280;\n    font-size: 13px;\n}\n\n.add-product-btn {\n    background: #2563eb;\n    color: white;\n    border: none;\n    padding: 12px 18px;\n    border-radius: 8px;\n    cursor: pointer;\n    font-size: 14px;\n}\n\n.add-product-btn:hover {\n    background: #1d4ed8;\n}\n\n\n/* Product Stats */\n\n.product-stats {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 20px;\n    margin-bottom: 20px;\n}\n\n.product-stat-card {\n    background: white;\n    border: 1px solid #e5e7eb;\n    border-radius: 12px;\n    padding: 20px;\n}\n\n.product-stat-card span {\n    display: block;\n    color: #6b7280;\n    font-size: 13px;\n    margin-bottom: 8px;\n}\n\n.product-stat-card strong {\n    font-size: 25px;\n}\n\n\n/* Tools */\n\n.products-tools {\n    background: white;\n    border: 1px solid #e5e7eb;\n    border-radius: 12px;\n    padding: 18px;\n    display: flex;\n    gap: 15px;\n    margin-bottom: 20px;\n}\n\n.products-tools input,\n.products-tools select {\n    padding: 11px 13px;\n    border: 1px solid #d1d5db;\n    border-radius: 7px;\n    outline: none;\n}\n\n.products-tools input {\n    flex: 1;\n}\n\n.products-tools input:focus,\n.products-tools select:focus {\n    border-color: #2563eb;\n}\n\n\n/* Table */\n\n.products-table-card {\n    background: white;\n    border: 1px solid #e5e7eb;\n    border-radius: 12px;\n    overflow: hidden;\n}\n\n.products-table-card table {\n    min-width: 900px;\n}\n\n.products-table-card td,\n.products-table-card th {\n    white-space: nowrap;\n}\n\n.product-name {\n    font-weight: 600;\n}\n\n.product-subtitle {\n    display: block;\n    color: #6b7280;\n    font-size: 11px;\n    margin-top: 4px;\n}\n\n.stock-good {\n    color: #16a34a;\n    font-weight: 600;\n}\n\n.stock-low {\n    color: #dc2626;\n    font-weight: 600;\n}\n\n.product-status {\n    padding: 5px 9px;\n    border-radius: 20px;\n    font-size: 11px;\n}\n\n.status-in-stock {\n    background: #dcfce7;\n    color: #15803d;\n}\n\n.status-low-stock {\n    background: #fee2e2;\n    color: #b91c1c;\n}\n\n.delete-btn {\n    border: none;\n    background: #fee2e2;\n    color: #dc2626;\n    padding: 7px 10px;\n    border-radius: 6px;\n    cursor: pointer;\n}\n\n.delete-btn:hover {\n    background: #fecaca;\n}\n\n\n/* Modal */\n\n.modal-overlay {\n    display: none;\n    position: fixed;\n    inset: 0;\n    background: rgba(0, 0, 0, 0.5);\n    align-items: center;\n    justify-content: center;\n    padding: 20px;\n    z-index: 1000;\n}\n\n.modal-overlay.show {\n    display: flex;\n}\n\n.product-modal {\n    background: white;\n    width: 700px;\n    max-width: 100%;\n    border-radius: 14px;\n    padding: 25px;\n    max-height: 90vh;\n    overflow-y: auto;\n}\n\n.modal-header {\n    display: flex;\n    justify-content: space-between;\n    align-items: flex-start;\n    margin-bottom: 25px;\n}\n\n.modal-header h2 {\n    font-size: 20px;\n    margin-bottom: 5px;\n}\n\n.modal-header p {\n    color: #6b7280;\n    font-size: 12px;\n}\n\n.modal-header button {\n    border: none;\n    background: #f3f4f6;\n    font-size: 25px;\n    width: 35px;\n    height: 35px;\n    border-radius: 7px;\n    cursor: pointer;\n}\n\n\n/* Form */\n\n.form-grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 18px;\n}\n\n.form-group {\n    display: flex;\n    flex-direction: column;\n    gap: 7px;\n}\n\n.form-group label {\n    font-size: 13px;\n    font-weight: 600;\n}\n\n.form-group input,\n.form-group select {\n    padding: 11px 12px;\n    border: 1px solid #d1d5db;\n    border-radius: 7px;\n    outline: none;\n}\n\n.form-group input:focus,\n.form-group select:focus {\n    border-color: #2563eb;\n}\n\n.modal-actions {\n    display: flex;\n    justify-content: flex-end;\n    gap: 10px;\n    margin-top: 25px;\n    padding-top: 20px;\n    border-top: 1px solid #e5e7eb;\n}\n\n.cancel-btn {\n    border: 1px solid #d1d5db;\n    background: white;\n    padding: 11px 18px;\n    border-radius: 7px;\n    cursor: pointer;\n}\n\n.save-product-btn {\n    border: none;\n    background: #2563eb;\n    color: white;\n    padding: 11px 18px;\n    border-radius: 7px;\n    cursor: pointer;\n}\n\n\n/* Mobile */\n\n@media (max-width: 800px) {\n\n    .product-stats {\n        grid-template-columns: 1fr 1fr;\n    }\n\n    .products-heading {\n        align-items: flex-start;\n        gap: 15px;\n        flex-direction: column;\n    }\n\n    .products-tools {\n        flex-direction: column;\n    }\n\n    .form-grid {\n        grid-template-columns: 1fr;\n    }\n}\n\n\n@media (max-width: 500px) {\n\n    .product-stats {\n        grid-template-columns: 1fr;\n    }\n\n    .products-page {\n        padding: 15px;\n    }\n\n}\u003c/style>\n\n\u003c/head>\n\n\u003cbody>\n\n\n    \u003c!-- Sidebar -->\n\n    \u003caside class=\"sidebar\">\n\n        \u003cdiv class=\"logo\">\n\n            \u003ch2>Gentle Fiters\u003c/h2>\n\n            \u003cspan>Garments Management\u003c/span>\n\n        \u003c/div>\n\n\n        \u003cnav class=\"sidebar-nav\">\n            \u003ca href=\"index.html\" class=\"nav-link\">\n                \u003cspan>\ud83c\udfe0\u003c/span> Home\u003c/a>\n            \u003ca href=\"products.html\" class=\"nav-link active\">\n                \u003cspan>\ud83d\udc55\u003c/span> Products\u003c/a>\n            \u003ca href=\"categories.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\uddc2\ufe0f\u003c/span> Categories\u003c/a>\n            \u003ca href=\"sales.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\uded2\u003c/span> Sales / POS\u003c/a>\n            \u003ca href=\"sales-history.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\udccb\u003c/span> Sales History\u003c/a>\n            \u003ca href=\"customers.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\udc65\u003c/span> Customers\u003c/a>\n            \u003ca href=\"suppliers.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\ude9a\u003c/span> Suppliers\u003c/a>\n            \u003ca href=\"purchases.html\" class=\"nav-link\">\n                \u003cspan>\ud83e\uddfe\u003c/span> Purchases\u003c/a>\n            \u003ca href=\"expenses.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\udcb8\u003c/span> Expenses\u003c/a>\n            \u003ca href=\"returns.html\" class=\"nav-link\">\n                \u003cspan>\u21a9\ufe0f\u003c/span> Returns\u003c/a>\n            \u003ca href=\"reports.html\" class=\"nav-link\">\n                \u003cspan>\ud83d\udcca\u003c/span> Reports\u003c/a>\n            \u003ca href=\"settings.html\" class=\"nav-link\">\n                \u003cspan>\u2699\ufe0f\u003c/span> Settings\u003c/a>\n        \u003c/nav>\n\n\n        \u003cdiv class=\"sidebar-bottom\">\n\n            \u003cp>Gentle Fiters v1.0\u003c/p>\n\n        \u003c/div>\n\n\n    \u003c/aside>\n\n\n\n    \u003c!-- Main Content -->\n\n    \u003cmain class=\"main-content\">\n\n\n        \u003c!-- Header -->\n\n        \u003cheader class=\"topbar\">\n\n\n            \u003cdiv>\n\n                \u003ch1>Products\u003c/h1>\n\n                \u003cp>Manage your garments inventory\u003c/p>\n\n            \u003c/div>\n\n\n            \u003cdiv class=\"user-area\">\n\n\n                \u003cdiv class=\"notification\">\n\n                    \ud83d\udd14\n\n                \u003c/div>\n\n\n                \u003cdiv class=\"user-info\">\n\n                    \u003cstrong>Admin\u003c/strong>\n\n                    \u003cspan>Store Manager\u003c/span>\n\n                \u003c/div>\n\n\n            \u003c/div>\n\n\n        \u003c/header>\n\n\n\n        \u003c!-- Products Content -->\n\n        \u003csection class=\"products-page\">\n\n\n            \u003c!-- Page Header -->\n\n            \u003cdiv class=\"products-heading\">\n\n\n                \u003cdiv>\n\n                    \u003ch2>Product Inventory\u003c/h2>\n\n                    \u003cp>Add and manage your garments products.\u003c/p>\n\n                \u003c/div>\n\n\n                \u003cbutton\n                    class=\"add-product-btn\"\n                    id=\"openProductModal\"\n                >\n\n                    + Add Product\n\n                \u003c/button>\n\n\n            \u003c/div>\n\n\n\n            \u003c!-- Inventory Stats -->\n\n            \u003cdiv class=\"product-stats\">\n\n\n                \u003cdiv class=\"product-stat-card\">\n\n                    \u003cspan>Total Products\u003c/span>\n\n                    \u003cstrong id=\"totalProducts\">\n                        0\n                    \u003c/strong>\n\n                \u003c/div>\n\n\n                \u003cdiv class=\"product-stat-card\">\n\n                    \u003cspan>Total Stock\u003c/span>\n\n                    \u003cstrong id=\"totalStock\">\n                        0\n                    \u003c/strong>\n\n                \u003c/div>\n\n\n                \u003cdiv class=\"product-stat-card\">\n\n                    \u003cspan>Low Stock\u003c/span>\n\n                    \u003cstrong id=\"lowStock\">\n                        0\n                    \u003c/strong>\n\n                \u003c/div>\n\n\n                \u003cdiv class=\"product-stat-card\">\n\n                    \u003cspan>Categories\u003c/span>\n\n                    \u003cstrong id=\"totalCategories\">\n                        0\n                    \u003c/strong>\n\n                \u003c/div>\n\n\n            \u003c/div>\n\n\n\n            \u003c!-- Search -->\n\n            \u003cdiv class=\"products-tools\">\n\n\n                \u003cinput\n                    type=\"text\"\n                    id=\"searchProduct\"\n                    placeholder=\"Search product name or SKU...\"\n                >\n\n\n                \u003cselect id=\"categoryFilter\">\n\n\n                    \u003coption value=\"all\">\n                        All Categories\n                    \u003c/option>\n\n\n                    \u003coption value=\"T-Shirts\">\n                        T-Shirts\n                    \u003c/option>\n\n\n                    \u003coption value=\"Shirts\">\n                        Shirts\n                    \u003c/option>\n\n\n                    \u003coption value=\"Jeans\">\n                        Jeans\n                    \u003c/option>\n\n\n                    \u003coption value=\"Trousers\">\n                        Trousers\n                    \u003c/option>\n\n\n                    \u003coption value=\"Jackets\">\n                        Jackets\n                    \u003c/option>\n\n\n                \u003c/select>\n\n\n            \u003c/div>\n\n\n\n            \u003c!-- Product Table -->\n\n            \u003cdiv class=\"products-table-card\">\n\n\n                \u003cdiv class=\"table-wrapper\">\n\n\n                    \u003ctable>\n\n\n                        \u003cthead>\n\n                            \u003ctr>\n\n                                \u003cth>Product\u003c/th>\n\n                                \u003cth>SKU\u003c/th>\n\n                                \u003cth>Category\u003c/th>\n\n                                \u003cth>Size\u003c/th>\n\n                                \u003cth>Color\u003c/th>\n\n                                \u003cth>Price\u003c/th>\n\n                                \u003cth>Stock\u003c/th>\n\n                                \u003cth>Status\u003c/th>\n\n                                \u003cth>Action\u003c/th>\n\n                            \u003c/tr>\n\n                        \u003c/thead>\n\n\n                        \u003ctbody id=\"productTableBody\">\n\n                        \u003c/tbody>\n\n\n                    \u003c/table>\n\n\n                \u003c/div>\n\n\n            \u003c/div>\n\n\n        \u003c/section>\n\n\n    \u003c/main>\n\n\n\n    \u003c!-- Add Product Modal -->\n\n    \u003cdiv\n        class=\"modal-overlay\"\n        id=\"productModal\"\n    >\n\n\n        \u003cdiv class=\"product-modal\">\n\n\n            \u003cdiv class=\"modal-header\">\n\n\n                \u003cdiv>\n\n                    \u003ch2>Add New Product\u003c/h2>\n\n                    \u003cp>\n                        Enter product information below.\n                    \u003c/p>\n\n                \u003c/div>\n\n\n                \u003cbutton\n                    id=\"closeProductModal\"\n                    type=\"button\"\n                >\n\n                    \u00d7\n\n                \u003c/button>\n\n\n            \u003c/div>\n\n\n\n            \u003cform id=\"productForm\">\n\n\n                \u003cdiv class=\"form-grid\">\n\n\n                    \u003cdiv class=\"form-group\">\n\n\n                        \u003clabel>\n                            Product Name\n                        \u003c/label>\n\n\n                        \u003cinput\n                            type=\"text\"\n                            id=\"productName\"\n                            placeholder=\"e.g. Premium T-Shirt\"\n                            required\n                        >\n\n\n                    \u003c/div>\n\n\n\n                    \u003cdiv class=\"form-group\">\n\n\n                        \u003clabel>\n                            SKU\n                        \u003c/label>\n\n\n                        \u003cinput\n                            type=\"text\"\n                            id=\"productSKU\"\n                            placeholder=\"e.g. GFT-001\"\n                            required\n                        >\n\n\n                    \u003c/div>\n\n\n\n                    \u003cdiv class=\"form-group\">\n\n\n                        \u003clabel>\n                            Category\n                        \u003c/label>\n\n\n                        \u003cselect\n                            id=\"productCategory\"\n                            required\n                        >\n\n\n                            \u003coption value=\"\">\n                                Select Category\n                            \u003c/option>\n\n\n                            \u003coption value=\"T-Shirts\">\n                                T-Shirts\n                            \u003c/option>\n\n\n                            \u003coption value=\"Shirts\">\n                                Shirts\n                            \u003c/option>\n\n\n                            \u003coption value=\"Jeans\">\n                                Jeans\n                            \u003c/option>\n\n\n                            \u003coption value=\"Trousers\">\n                                Trousers\n                            \u003c/option>\n\n\n                            \u003coption value=\"Jackets\">\n                                Jackets\n                            \u003c/option>\n\n\n                        \u003c/select>\n\n\n                    \u003c/div>\n\n\n\n                    \u003cdiv class=\"form-group\">\n\n\n                        \u003clabel>\n                            Size\n                        \u003c/label>\n\n\n                        \u003cselect\n                            id=\"productSize\"\n                            required\n                        >\n\n\n                            \u003coption value=\"\">\n                                Select Size\n                            \u003c/option>\n\n\n                            \u003coption value=\"S\">\n                                Small\n                            \u003c/option>\n\n\n                            \u003coption value=\"M\">\n                                Medium\n                            \u003c/option>\n\n\n                            \u003coption value=\"L\">\n                                Large\n                            \u003c/option>\n\n\n                            \u003coption value=\"XL\">\n                                XL\n                            \u003c/option>\n\n\n                            \u003coption value=\"XXL\">\n                                XXL\n                            \u003c/option>\n\n\n                        \u003c/select>\n\n\n                    \u003c/div>\n\n\n\n                    \u003cdiv class=\"form-group\">\n\n\n                        \u003clabel>\n                            Color\n                        \u003c/label>\n\n\n                        \u003cinput\n                            type=\"text\"\n                            id=\"productColor\"\n                            placeholder=\"e.g. Black\"\n                            required\n                        >\n\n\n                    \u003c/div>\n\n\n\n                    \u003cdiv class=\"form-group\">\n\n\n                        \u003clabel>\n                            Selling Price\n                        \u003c/label>\n\n\n                        \u003cinput\n                            type=\"number\"\n                            id=\"productPrice\"\n                            placeholder=\"e.g. 2500\"\n                            min=\"0\"\n                            required\n                        >\n\n\n                    \u003c/div>\n\n\n\n                    \u003cdiv class=\"form-group\">\n\n\n                        \u003clabel>\n                            Purchase Price\n                        \u003c/label>\n\n\n                        \u003cinput\n                            type=\"number\"\n                            id=\"purchasePrice\"\n                            placeholder=\"e.g. 1800\"\n                            min=\"0\"\n                            required\n                        >\n\n\n                    \u003c/div>\n\n\n\n                    \u003cdiv class=\"form-group\">\n\n\n                        \u003clabel>\n                            Stock Quantity\n                        \u003c/label>\n\n\n                        \u003cinput\n                            type=\"number\"\n                            id=\"productStock\"\n                            placeholder=\"e.g. 20\"\n                            min=\"0\"\n                            required\n                        >\n\n\n                    \u003c/div>\n\n\n                \u003c/div>\n\n\n\n                \u003cdiv class=\"modal-actions\">\n\n\n                    \u003cbutton\n                        type=\"button\"\n                        class=\"cancel-btn\"\n                        id=\"cancelProduct\"\n                    >\n\n                        Cancel\n\n                    \u003c/button>\n\n\n                    \u003cbutton\n                        type=\"submit\"\n                        class=\"save-product-btn\"\n                    >\n\n                        Save Product\n\n                    \u003c/button>\n\n\n                \u003c/div>\n\n\n            \u003c/form>\n\n\n        \u003c/div>\n\n\n    \u003c/div>\n\n\n\n    \u003c!-- JavaScript -->\n\n    \u003cscript>\n/* =====================================\n   DASHBOARD - SAFE DATA HELPERS\n===================================== */\n\nfunction getDashboardData(key) {\n    try {\n        const data = JSON.parse(localStorage.getItem(key) || \"[]\");\n        return Array.isArray(data) ? data : [];\n    } catch (error) {\n        console.error(\"Dashboard data error:\", key, error);\n        return [];\n    }\n}\n\nfunction dashboardMoney(amount) {\n    const value = Number(amount) || 0;\n\n    return \"Rs. \" + value.toLocaleString(\"en-PK\", {\n        maximumFractionDigits: 2\n    });\n}\n\nfunction dashboardDate(dateValue) {\n    if (!dateValue) return null;\n\n    const date = new Date(dateValue);\n\n    return Number.isNaN(date.getTime()) ? null : date;\n}\n\nfunction dashboardSameDay(first, second) {\n    return first.getFullYear() === second.getFullYear() &&\n        first.getMonth() === second.getMonth() &&\n        first.getDate() === second.getDate();\n}\n\nfunction dashboardElement(id) {\n    return document.getElementById(id);\n}\n\n\n/* =====================================\n   DASHBOARD - MAIN STATISTICS\n===================================== */\n\nfunction loadDashboardStats() {\n    const sales = getDashboardData(\"gentleFitersSales\");\n    const products = getDashboardData(\"gentleFitersProducts\");\n\n    const today = new Date();\n\n    const todaysSales = sales.filter(function (sale) {\n        const date = dashboardDate(sale.date);\n        return date && dashboardSameDay(date, today);\n    });\n\n    const todayRevenue = todaysSales.reduce(function (total, sale) {\n        return total + (Number(sale.total) || 0);\n    }, 0);\n\n    const lowStockProducts = products.filter(function (product) {\n        return (Number(product.stock) || 0) \u003c= gfLowStockLimit();\n    });\n\n    const todaySalesElement = dashboardElement(\"todaySalesValue\");\n    const todayOrdersElement = dashboardElement(\"todayOrdersValue\");\n    const totalProductsElement = dashboardElement(\"totalProductsValue\");\n    const lowStockElement = dashboardElement(\"lowStockCount\");\n\n    if (todaySalesElement) {\n        todaySalesElement.textContent = dashboardMoney(todayRevenue);\n    }\n\n    if (todayOrdersElement) {\n        todayOrdersElement.textContent = todaysSales.length;\n    }\n\n    if (totalProductsElement) {\n        totalProductsElement.textContent = products.length;\n    }\n\n    if (lowStockElement) {\n        lowStockElement.textContent = lowStockProducts.length;\n    }\n}\n\n\n/* =====================================\n   DASHBOARD - LOW STOCK ALERTS\n===================================== */\n\nfunction loadDashboardLowStock() {\n    const container = dashboardElement(\"lowStockList\");\n\n    if (!container) return;\n\n    const products = getDashboardData(\"gentleFitersProducts\");\n\n    const lowStockProducts = products\n        .filter(function (product) {\n            return (Number(product.stock) || 0) \u003c= gfLowStockLimit();\n        })\n        .sort(function (a, b) {\n            return (Number(a.stock) || 0) -\n                (Number(b.stock) || 0);\n        })\n        .slice(0, 5);\n\n    container.replaceChildren();\n\n    if (lowStockProducts.length === 0) {\n        const message = document.createElement(\"p\");\n        message.textContent =\n            \"No low-stock products. Inventory looks good!\";\n        container.appendChild(message);\n        return;\n    }\n\n    lowStockProducts.forEach(function (product) {\n        const item = document.createElement(\"div\");\n        item.className = \"stock-item\";\n\n        const details = document.createElement(\"div\");\n\n        const name = document.createElement(\"strong\");\n        name.textContent = product.name || \"Unnamed Product\";\n\n        const description = document.createElement(\"span\");\n        const extraDetails = [product.size, product.color]\n            .filter(Boolean)\n            .join(\" / \");\n\n        description.textContent = extraDetails || \"Inventory alert\";\n\n        const stock = document.createElement(\"b\");\n        stock.textContent =\n            (Number(product.stock) || 0) + \" left\";\n\n        details.appendChild(name);\n        details.appendChild(description);\n\n        item.appendChild(details);\n        item.appendChild(stock);\n\n        container.appendChild(item);\n    });\n}\n\n\n/* =====================================\n   DASHBOARD - RECENT SALES\n===================================== */\n\nfunction loadDashboardRecentSales() {\n    const tbody = dashboardElement(\"recentSalesBody\");\n\n    if (!tbody) return;\n\n    const sales = getDashboardData(\"gentleFitersSales\");\n\n    const recentSales = sales.slice().sort(function (a, b) {\n        const dateA = dashboardDate(a.date);\n        const dateB = dashboardDate(b.date);\n\n        return (dateB ? dateB.getTime() : Number(b.id) || 0) -\n            (dateA ? dateA.getTime() : Number(a.id) || 0);\n    }).slice(0, 5);\n\n    tbody.replaceChildren();\n\n    if (recentSales.length === 0) {\n        const row = document.createElement(\"tr\");\n        const cell = document.createElement(\"td\");\n\n        cell.colSpan = 5;\n        cell.textContent = \"No sales recorded yet.\";\n\n        row.appendChild(cell);\n        tbody.appendChild(row);\n        return;\n    }\n\n    recentSales.forEach(function (sale) {\n        const row = document.createElement(\"tr\");\n\n        const saleId = document.createElement(\"td\");\n        saleId.textContent = sale.id ? String(sale.id) : \"\u2014\";\n\n        const dateCell = document.createElement(\"td\");\n        const date = dashboardDate(sale.date);\n\n        dateCell.textContent = date\n            ? date.toLocaleDateString()\n            : \"\u2014\";\n\n        const customerCell = document.createElement(\"td\");\n        customerCell.textContent =\n            sale.customerName || \"Walk-in Customer\";\n\n        const itemsCell = document.createElement(\"td\");\n        const itemCount = Array.isArray(sale.items)\n            ? sale.items.reduce(function (total, item) {\n                return total + (Number(item.quantity) || 0);\n            }, 0)\n            : 0;\n\n        itemsCell.textContent = itemCount;\n\n        const totalCell = document.createElement(\"td\");\n        totalCell.textContent = dashboardMoney(sale.total);\n\n        row.appendChild(saleId);\n        row.appendChild(dateCell);\n        row.appendChild(customerCell);\n        row.appendChild(itemsCell);\n        row.appendChild(totalCell);\n\n        tbody.appendChild(row);\n    });\n}\n\n\n/* =====================================\n   DASHBOARD - SALES CHART\n===================================== */\n\nfunction loadDashboardChart() {\n    const chart = dashboardElement(\"salesChart\");\n    const periodSelect = dashboardElement(\"salesPeriod\");\n\n    if (!chart) return;\n\n    const sales = getDashboardData(\"gentleFitersSales\");\n    const period = periodSelect ? periodSelect.value : \"7\";\n    const today = new Date();\n\n    let buckets = [];\n\n    if (period === \"year\") {\n        for (let month = 0; month \u003c 12; month++) {\n            buckets.push({\n                label: new Date(today.getFullYear(), month, 1)\n                    .toLocaleDateString(\"en\", { month: \"short\" }),\n                start: new Date(today.getFullYear(), month, 1),\n                end: new Date(today.getFullYear(), month + 1, 1),\n                total: 0\n            });\n        }\n    } else {\n        const days = period === \"30\" ? 30 : 7;\n\n        for (let i = days - 1; i >= 0; i--) {\n            const date = new Date(today);\n            date.setHours(0, 0, 0, 0);\n            date.setDate(date.getDate() - i);\n\n            const end = new Date(date);\n            end.setDate(end.getDate() + 1);\n\n            buckets.push({\n                label: period === \"30\"\n                    ? date.getDate() + \"/\" + (date.getMonth() + 1)\n                    : date.toLocaleDateString(\"en\", {\n                        weekday: \"short\"\n                    }),\n                start: date,\n                end: end,\n                total: 0\n            });\n        }\n    }\n\n    sales.forEach(function (sale) {\n        const date = dashboardDate(sale.date);\n\n        if (!date) return;\n\n        buckets.forEach(function (bucket) {\n            if (date >= bucket.start && date \u003c bucket.end) {\n                bucket.total += Number(sale.total) || 0;\n            }\n        });\n    });\n\n    chart.replaceChildren();\n\n    const maxTotal = Math.max(\n        ...buckets.map(function (bucket) {\n            return bucket.total;\n        }),\n        1\n    );\n\n    buckets.forEach(function (bucket) {\n        const column = document.createElement(\"div\");\n\n        column.style.display = \"flex\";\n        column.style.flexDirection = \"column\";\n        column.style.alignItems = \"center\";\n        column.style.justifyContent = \"flex-end\";\n        column.style.flex = \"1\";\n        column.style.minWidth = \"0\";\n        column.style.height = \"100%\";\n\n        const bar = document.createElement(\"div\");\n        bar.className = \"bar\";\n\n        bar.style.width =\n            period === \"30\" || period === \"year\" ? \"65%\" : \"35px\";\n\n        const height = bucket.total > 0\n            ? Math.max((bucket.total / maxTotal) * 85, 4)\n            : 2;\n\n        bar.style.height = height + \"%\";\n        bar.style.minHeight = \"2px\";\n        bar.title = bucket.label + \": \" +\n            dashboardMoney(bucket.total);\n\n        const label = document.createElement(\"span\");\n        label.textContent = bucket.label;\n\n        column.appendChild(bar);\n        column.appendChild(label);\n\n        chart.appendChild(column);\n    });\n}\n\n\n/* =====================================\n   INITIALIZE DASHBOARD\n===================================== */\n\nfunction loadDashboard() {\n    if (!dashboardElement(\"todaySalesValue\")) return;\n\n    loadDashboardStats();\n    loadDashboardLowStock();\n    loadDashboardRecentSales();\n    loadDashboardChart();\n}\n\nloadDashboard();\n\nconst dashboardPeriod = dashboardElement(\"salesPeriod\");\n\nif (dashboardPeriod) {\n    dashboardPeriod.addEventListener(\"change\", loadDashboardChart);\n}\n\n\n/* =====================================\n   GENTLE FITERS - SIDEBAR SCROLL\n===================================== */\n\n(function () {\n    const storageKey = \"gentleFitersSidebarScroll\";\n\n    function setupSidebarScroll() {\n        const sidebarNav = document.querySelector(\".sidebar-nav\");\n\n        if (!sidebarNav) return;\n\n        function saveSidebarScroll() {\n            try {\n                sessionStorage.setItem(\n                    storageKey,\n                    String(sidebarNav.scrollTop)\n                );\n            } catch (error) {\n                console.warn(\"Could not save sidebar position.\", error);\n            }\n        }\n\n        function restoreSidebarScroll() {\n            try {\n                const savedPosition = Number(\n                    sessionStorage.getItem(storageKey)\n                ) || 0;\n\n                const maxScroll = Math.max(\n                    0,\n                    sidebarNav.scrollHeight - sidebarNav.clientHeight\n                );\n\n                sidebarNav.scrollTop = Math.min(\n                    savedPosition,\n                    maxScroll\n                );\n            } catch (error) {\n                console.warn(\"Could not restore sidebar position.\", error);\n            }\n        }\n\n        // Save position when a sidebar link is clicked.\n        sidebarNav.addEventListener(\"click\", function (event) {\n            const link = event.target.closest(\"a.nav-link\");\n\n            if (link && sidebarNav.contains(link)) {\n                saveSidebarScroll();\n            }\n        }, true);\n\n        // Save the latest position before leaving the page.\n        window.addEventListener(\"pagehide\", saveSidebarScroll);\n\n        // Restore after page load and layout calculations.\n        function restoreSeveralTimes() {\n            restoreSidebarScroll();\n\n            requestAnimationFrame(function () {\n                restoreSidebarScroll();\n\n                requestAnimationFrame(function () {\n                    restoreSidebarScroll();\n                });\n            });\n\n            setTimeout(restoreSidebarScroll, 100);\n            setTimeout(restoreSidebarScroll, 300);\n            setTimeout(restoreSidebarScroll, 700);\n        }\n\n        if (document.readyState === \"complete\") {\n            restoreSeveralTimes();\n        } else {\n            window.addEventListener(\n                \"load\",\n                restoreSeveralTimes,\n                { once: true }\n            );\n        }\n    }\n\n    if (document.readyState === \"loading\") {\n        document.addEventListener(\n            \"DOMContentLoaded\",\n            setupSidebarScroll,\n            { once: true }\n        );\n    } else {\n        setupSidebarScroll();\n    }\n})();\n\n/* =====================================\n   GENTLE FITERS - SHARED HELPERS (all pages)\n===================================== */\n\n// Escape user text before putting it inside innerHTML.\nfunction gfEscape(value) {\n    return String(value === undefined || value === null ? \"\" : value)\n        .replace(/&/g, \"&amp;\")\n        .replace(/\u003c/g, \"&lt;\")\n        .replace(/>/g, \"&gt;\")\n        .replace(/\"/g, \"&quot;\")\n        .replace(/'/g, \"&#39;\");\n}\n\n// Low-stock limit comes from Settings > Inventory (default 5).\nfunction gfLowStockLimit() {\n    try {\n        const saved = JSON.parse(localStorage.getItem(\"gentleFitersSettings\") || \"{}\");\n        const limit = Number(saved && saved.inventory && saved.inventory.lowStockThreshold);\n        return Number.isFinite(limit) && limit >= 0 ? limit : 5;\n    } catch (error) {\n        return 5;\n    }\n}\n\nfunction gfRead(key) {\n    try {\n        const data = JSON.parse(localStorage.getItem(key) || \"[]\");\n        return Array.isArray(data) ? data : [];\n    } catch (error) {\n        return [];\n    }\n}\n\n// Default categories are created once, so the Categories page and the\n// Products page always share the same list.\n(function seedCategories() {\n    try {\n        if (localStorage.getItem(\"gentleFitersCategories\") !== null) return;\n\n        const names = [\"T-Shirts\", \"Shirts\", \"Jeans\", \"Trousers\", \"Jackets\"];\n        gfRead(\"gentleFitersProducts\").forEach(function (product) {\n            if (product.category && names.indexOf(product.category) === -1) {\n                names.push(product.category);\n            }\n        });\n\n        localStorage.setItem(\"gentleFitersCategories\", JSON.stringify(\n            names.map(function (name, index) {\n                return { id: Date.now() + index, name: name };\n            })\n        ));\n    } catch (error) {\n        console.warn(\"Could not seed categories.\", error);\n    }\n})();\n\n// Fill the category dropdowns on the Products page from saved categories.\nfunction gfFillCategorySelects() {\n    const names = gfRead(\"gentleFitersCategories\").map(function (c) { return c.name; });\n\n    gfRead(\"gentleFitersProducts\").forEach(function (product) {\n        if (product.category && names.indexOf(product.category) === -1) {\n            names.push(product.category);\n        }\n    });\n\n    [[\"productCategory\", \"Select Category\", \"\"], [\"categoryFilter\", \"All Categories\", \"all\"]]\n        .forEach(function (config) {\n            const select = document.getElementById(config[0]);\n            if (!select) return;\n\n            const previous = select.value;\n            select.replaceChildren();\n\n            const first = document.createElement(\"option\");\n            first.value = config[2];\n            first.textContent = config[1];\n            select.appendChild(first);\n\n            names.forEach(function (name) {\n                const option = document.createElement(\"option\");\n                option.value = name;\n                option.textContent = name;\n                select.appendChild(option);\n            });\n\n            select.value = previous;\n        });\n}\ngfFillCategorySelects();\n\n\n/* =====================================\n   GENTLE FITERS - NAVIGATION\n===================================== */\n\n(function setupNavigation() {\n    function init() {\n        // Make sure the right sidebar link is highlighted on every page.\n        const current = (location.pathname.split(\"/\").pop() || \"index.html\").toLowerCase();\n        document.querySelectorAll(\".sidebar-nav a.nav-link\").forEach(function (link) {\n            const target = (link.getAttribute(\"href\") || \"\").toLowerCase();\n            link.classList.toggle(\"active\", target === current);\n        });\n\n        // Browser tab title shows the current page name.\n        const heading = document.querySelector(\".topbar h1\");\n        if (heading && heading.textContent.trim()) {\n            document.title = heading.textContent.trim() + \" | Gentle Fiters\";\n        }\n\n        // Notification bell: shows low-stock count and opens Products.\n        const bell = document.querySelector(\".notification\");\n        if (bell) {\n            const low = gfRead(\"gentleFitersProducts\").filter(function (p) {\n                return (Number(p.stock) || 0) \u003c= gfLowStockLimit();\n            }).length;\n\n            bell.style.cursor = \"pointer\";\n            bell.style.position = \"relative\";\n            bell.setAttribute(\"role\", \"link\");\n            bell.title = low ? low + \" product(s) low on stock\" : \"No stock alerts\";\n\n            if (low > 0) {\n                const badge = document.createElement(\"span\");\n                badge.textContent = low > 99 ? \"99+\" : low;\n                badge.style.cssText = \"position:absolute;top:-6px;right:-8px;background:#ef4444;\" +\n                    \"color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;\" +\n                    \"border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;\";\n                bell.appendChild(badge);\n            }\n\n            bell.addEventListener(\"click\", function () {\n                window.location.href = \"products.html\";\n            });\n        }\n    }\n\n    if (document.readyState === \"loading\") {\n        document.addEventListener(\"DOMContentLoaded\", init, { once: true });\n    } else {\n        init();\n    }\n})();\n\u003c/script>\n\n    \u003cscript>// ==========================================\n// Gentle Fiters - Products Management\n// ==========================================\n\n// Load products from localStorage\nlet products = JSON.parse(\n    localStorage.getItem(\"gentleFitersProducts\")\n) || [];\n\n// Track which product is being edited\nlet editingProductId = null;\n\n\n// ==========================================\n// Get HTML Elements\n// ==========================================\n\nconst productModal = document.getElementById(\"productModal\");\nconst openProductModal = document.getElementById(\"openProductModal\");\nconst closeProductModal = document.getElementById(\"closeProductModal\");\nconst cancelProduct = document.getElementById(\"cancelProduct\");\n\nconst productForm = document.getElementById(\"productForm\");\n\nconst productTableBody = document.getElementById(\"productTableBody\");\n\nconst searchProduct = document.getElementById(\"searchProduct\");\nconst categoryFilter = document.getElementById(\"categoryFilter\");\n\n\n// ==========================================\n// Open Product Modal\n// ==========================================\n\nopenProductModal.addEventListener(\"click\", function () {\n\n    productModal.classList.add(\"show\");\n\n});\n\n\n// ==========================================\n// Close Product Modal\n// ==========================================\n\ncloseProductModal.addEventListener(\"click\", closeModal);\n\ncancelProduct.addEventListener(\"click\", closeModal);\n\nfunction closeModal() {\n    productModal.classList.remove(\"show\");\n    productForm.reset();\n    editingProductId = null;\n}\n\n\n// ==========================================\n// Add Product\n// ==========================================\n\nproductForm.addEventListener(\"submit\", function (event) {\n    event.preventDefault();\n\n    const productData = {\n        name: document.getElementById(\"productName\").value.trim(),\n        sku: document.getElementById(\"productSKU\").value.trim(),\n        category: document.getElementById(\"productCategory\").value,\n        size: document.getElementById(\"productSize\").value.trim(),\n        color: document.getElementById(\"productColor\").value.trim(),\n        price: Number(document.getElementById(\"productPrice\").value),\n        purchasePrice: Number(document.getElementById(\"purchasePrice\").value),\n        stock: Number(document.getElementById(\"productStock\").value)\n    };\n\n    const skuTaken = products.some(function (item) {\n        return String(item.sku || \"\").toLowerCase() === productData.sku.toLowerCase() &&\n            item.id !== editingProductId;\n    });\n\n    if (skuTaken) {\n        alert(\"A product with SKU \\\"\" + productData.sku + \"\\\" already exists. Please use a unique SKU.\");\n        return;\n    }\n\n    if (editingProductId !== null) {\n        products = products.map(function (product) {\n            if (product.id === editingProductId) {\n                return {\n                    ...product,\n                    ...productData\n                };\n            }\n\n            return product;\n        });\n    } else {\n        products.push({\n            id: Date.now(),\n            ...productData\n        });\n    }\n\n    saveProducts();\n\n    editingProductId = null;\n    productForm.reset();\n    closeModal();\n    renderProducts();\n});\n\n// ==========================================\n// Save Products\n// ==========================================\n\nfunction saveProducts() {\n\n    localStorage.setItem(\"gentleFitersProducts\",\n        JSON.stringify(products)\n    );\n\n}\n\n\n// ==========================================\n// Display Products\n// ==========================================\n\nfunction renderProducts() {\n\n    const searchValue =\n        searchProduct.value.toLowerCase().trim();\n\n    const categoryValue =\n        categoryFilter.value;\n\n\n    const filteredProducts = products.filter(function (product) {\n\n        const productName =\n            String(product.name || \"\").toLowerCase();\n\n        const productSKU =\n            String(product.sku || \"\").toLowerCase();\n\n\n        const matchesSearch =\n            productName.includes(searchValue) ||\n            productSKU.includes(searchValue);\n\n\n        const matchesCategory =\n            categoryValue === \"all\" ||\n            product.category === categoryValue;\n\n\n        return matchesSearch && matchesCategory;\n\n    });\n\n\n    // Clear table\n    productTableBody.innerHTML = \"\";\n\n\n    // No products found\n    if (filteredProducts.length === 0) {\n\n        productTableBody.innerHTML = `\n            \u003ctr>\n                \u003ctd colspan=\"9\" style=\"text-align: center; padding: 30px;\">\n                    No products found.\n                \u003c/td>\n            \u003c/tr>\n        `;\n\n        updateStats();\n\n        return;\n\n    }\n\n\n    // Display products\n    filteredProducts.forEach(function (product) {\n\n\n        // Stock status\n        const stockStatus =\n            product.stock \u003c= gfLowStockLimit()\n                ? \"Low Stock\"\n                : \"In Stock\";\n\n\n        // Stock class\n        const stockClass =\n            product.stock \u003c= gfLowStockLimit()\n                ? \"stock-low\"\n                : \"stock-good\";\n\n\n        // Status class\n        const statusClass =\n            product.stock \u003c= gfLowStockLimit()\n                ? \"status-low-stock\"\n                : \"status-in-stock\";\n\n\n        // Create table row\n        const row = document.createElement(\"tr\");\n\n\n        // IMPORTANT: Template string starts with `\n        row.innerHTML = `\n\n            \u003ctd>\n\n                \u003cspan class=\"product-name\">\n                    ${gfEscape(product.name)}\n                \u003c/span>\n\n                \u003cspan class=\"product-subtitle\">\n                    ${product.purchasePrice\n                ? \"Cost: Rs. \" + product.purchasePrice\n                : \"\"\n            }\n                \u003c/span>\n\n            \u003c/td>\n\n\n            \u003ctd>\n                ${gfEscape(product.sku)}\n            \u003c/td>\n\n\n            \u003ctd>\n                ${gfEscape(product.category)}\n            \u003c/td>\n\n\n            \u003ctd>\n                ${gfEscape(product.size)}\n            \u003c/td>\n\n\n            \u003ctd>\n                ${gfEscape(product.color)}\n            \u003c/td>\n\n\n            \u003ctd>\n                Rs. ${product.price}\n            \u003c/td>\n\n\n            \u003ctd class=\"${stockClass}\">\n                ${product.stock}\n            \u003c/td>\n\n\n            \u003ctd>\n\n                \u003cspan class=\"product-status ${statusClass}\">\n                    ${stockStatus}\n                \u003c/span>\n\n            \u003c/td>\n\n\n            \u003ctd>\n            \u003cbutton\n    class=\"edit-btn\"\n    onclick=\"editProduct(${product.id})\"\n>\n    Edit\n\u003c/button>\n\n                \u003cbutton\n                    class=\"delete-btn\"\n                    onclick=\"deleteProduct(${product.id})\"\n                >\n                    Delete\n                \u003c/button>\n\n            \u003c/td>\n\n        `;\n\n\n        // Add row to table\n        productTableBody.appendChild(row);\n\n    });\n\n\n    updateStats();\n\n}\n// Edit Product\nfunction editProduct(id) {\n    const product = products.find(function (item) {\n        return item.id === id;\n    });\n\n    if (!product) {\n        return;\n    }\n\n    editingProductId = id;\n\n    document.getElementById(\"productName\").value = product.name;\n    document.getElementById(\"productSKU\").value = product.sku;\n    document.getElementById(\"productCategory\").value = product.category;\n    document.getElementById(\"productSize\").value = product.size;\n    document.getElementById(\"productColor\").value = product.color;\n    document.getElementById(\"productPrice\").value = product.price;\n    document.getElementById(\"purchasePrice\").value = product.purchasePrice;\n    document.getElementById(\"productStock\").value = product.stock;\n\n    productModal.classList.add(\"show\");\n}\n\n// ==========================================\n// Delete Product\n// ==========================================\n\nfunction deleteProduct(id) {\n\n    const confirmDelete =\n        confirm(\"Are you sure you want to delete this product?\");\n\n\n    if (!confirmDelete) {\n\n        return;\n\n    }\n\n\n    products = products.filter(function (product) {\n\n        return product.id !== id;\n\n    });\n\n\n    saveProducts();\n\n    renderProducts();\n\n}\n\n\n// ==========================================\n// Search Products\n// ==========================================\n\nsearchProduct.addEventListener(\n    \"input\",\n    renderProducts\n);\n\n\n// ==========================================\n// Category Filter\n// ==========================================\n\ncategoryFilter.addEventListener(\n    \"change\",\n    renderProducts\n);\n\n\n// ==========================================\n// Update Statistics\n// ==========================================\n\nfunction updateStats() {\n\n\n    // Total products\n    const totalProducts =\n        products.length;\n\n\n    // Total stock\n    const totalStock =\n        products.reduce(function (total, product) {\n\n            return total + product.stock;\n\n        }, 0);\n\n\n    // Low stock products\n    const lowStock =\n        products.filter(function (product) {\n\n            return product.stock \u003c= gfLowStockLimit();\n\n        }).length;\n\n\n    // Total categories\n    const categories =\n        new Set(\n            products.map(function (product) {\n\n                return product.category;\n\n            })\n        ).size;\n\n\n    // Update HTML\n    document.getElementById(\"totalProducts\").textContent =\n        totalProducts;\n\n\n    document.getElementById(\"totalStock\").textContent =\n        totalStock;\n\n\n    document.getElementById(\"lowStock\").textContent =\n        lowStock;\n\n\n    document.getElementById(\"totalCategories\").textContent =\n        categories;\n\n}\n\n\n// ==========================================\n// Initial Load\n// ==========================================\n\nrenderProducts();\u003c/script>\n\n\n\u003cscript>document.addEventListener(\"click\",function(e){var a=e.target.closest(\"a[href$=\\\".html\\\"]\");if(a){e.preventDefault();parent.postMessage({gfPage:a.getAttribute(\"href\")},\"*\");}});\u003c/script>\u003c/body>\n\n\u003c/html>"}</script>
